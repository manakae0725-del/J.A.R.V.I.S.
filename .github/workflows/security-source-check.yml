name: Security source checks

on:
  pull_request:
    branches: [main, perf/response-speed-memory-cache]
  push:
    branches: [security-audit-baseline-2026-10-17, chore/migration-source-and-ci-2026-11-02, perf/response-speed-memory-cache]

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static security source checks
        run: node scripts/security-source-check.mjs
      - name: Check server JavaScript syntax
        run: |
          node --check api/gemini.js
          node --check api/_calendarIntent.js
          node --check api/_aiCouncil.js
          node --check api/_google/oauth.js
          node --check api/_google/tokenStore.js
          node --check api/_google/client.js
          node --check lib/commanderRouting.js
          node --check lib/backgroundTasks.js
          node --check lib/jmaWeather.js
      - name: Verify Supabase migration source ledger
        run: node scripts/migration-ledger-check.mjs
      - name: Run JMA weather parser tests
        run: node --test tests/jmaWeather.test.js
      - name: Run Google Calendar intent regression tests
        run: node --test tests/calendar-intent.test.js
      - name: Run authentication API tests
        run: node --test scripts/auth.test.cjs
      - name: Run read-only connector API tests
        run: node --test scripts/connectors-api.test.cjs
      - name: Run current memory API tests
        run: node --test scripts/memory-api-current.test.cjs
      - name: Run rate-limit API tests
        run: node --test scripts/rate-limit.test.cjs
      - name: Run Gemini and TTS input boundary tests
        run: node --test scripts/provider-input.test.cjs
      - name: Run TTS provider response tests
        run: node --test scripts/tts-provider.test.cjs
