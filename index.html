<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>

<style>
body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 80px;
    font-size: 32px;
    letter-spacing: 6px;
}

button {
    margin-top: 100px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 2px solid #555;
    background: #111;
    color: white;
    font-size: 20px;
}

button:active {
    background: #333;
}

#status {
    margin-top: 30px;
    color: #aaa;
    padding: 0 20px;
    word-break: break-word;
}

#diagnostic {
    display: none;
    margin: 30px 20px;
    padding: 15px;
    background: #111;
    border: 1px solid #444;
    border-radius: 10px;
    color: #ddd;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.5;
    max-height: 500px;
    overflow-y: auto;
}
</style>
</head>

<body>

<h1>J.A.R.V.I.S.</h1>

<button id="talkButton">🎙️ 話す</button>

<div id="status">待機中</div>

<pre id="diagnostic"></pre>

<script>

const button = document.getElementById("talkButton");
const status = document.getElementById("status");
const diagnostic = document.getElementById("diagnostic");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let audioContext = null;
let currentSource = null;

let conversationActive = false;
let recognitionRunning = false;
let recognition = null;

/* ================================
   長期記憶
   ================================ */

let memories = [];


/* ================================
   エラーを安全に文字列化
   ================================ */

function getErrorMessage(error) {

    if (typeof error === "string") {
        return error;
    }

    if (error && typeof error === "object") {

        if (error.message) {
            return error.message;
        }

        try {
            return JSON.stringify(error);
        } catch (e) {
            return "不明なエラー";
        }
    }

    return String(error);
}


/* ================================
   長期記憶を取得
   ================================ */

async function loadMemories() {

    try {

        const response =
            await fetch("/api/memory", {
                method: "GET"
            });

        const data =
            await response.json();

        if (!response.ok || !data.ok) {
            throw new Error(
                getErrorMessage(data.error) ||
                "Memory GET error"
            );
        }

        memories =
            Array.isArray(data.memories)
                ? data.memories.slice(0, 30)
                : [];

        return memories;

    } catch (error) {

        console.error(
            "Memory load error:",
            error
        );

        memories = [];

        return [];
    }
}


/* ================================
   長期記憶をGemini用テキストへ変換
   ================================ */

function buildMemoryContext() {

    if (!memories.length) {

        return "現在、登録されている長期記憶はありません。";
    }

    return memories
        .map((memory, index) => {

            return (
                `${index + 1}. ` +
                `[${memory.category}] ` +
                `${memory.content}`
            );

        })
        .join("\n");
}


/* ================================
   「覚えて」系の発言を判定
   ================================ */

function isMemoryRequest(text) {

    const patterns = [
        "覚えて",
        "記憶して",
        "記憶に入れて",
        "記憶に残して",
        "覚えといて",
        "覚えておいて",
        "忘れないで"
    ];

    return patterns.some(
        pattern => text.includes(pattern)
    );
}


/* ================================
   記憶カテゴリ判定
   ================================ */

function detectMemoryCategory(text) {

    if (
        text.includes("好き") ||
        text.includes("嫌い") ||
        text.includes("好み") ||
        text.includes("好きな")
    ) {
        return "preference";
    }

    if (
        text.includes("仕事") ||
        text.includes("美容師") ||
        text.includes("サロン") ||
        text.includes("職場")
    ) {
        return "work";
    }

    if (
        text.includes("目標") ||
        text.includes("予定") ||
        text.includes("計画")
    ) {
        return "goal";
    }

    if (
        text.includes("家族") ||
        text.includes("妻") ||
        text.includes("娘") ||
        text.includes("母")
    ) {
        return "family";
    }

    return "personal";
}


/* ================================
   記憶内容を保存
   ================================ */

async function saveMemory(text) {

    const category =
        detectMemoryCategory(text);

    const content =
        text
            .replace(/^.*?(覚えて|記憶して|記憶に入れて|記憶に残して|覚えといて|覚えておいて|忘れないで)/, "")
            .trim()
            .replace(/^[、。\s]+/, "");

    if (!content) {
        return false;
    }

    try {

        const response =
            await fetch("/api/memory", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    category: category,
                    content: content,
                    importance: 3
                })
            });

        const data =
            await response.json();

        if (!response.ok || !data.ok) {

            throw new Error(
                getErrorMessage(data.error) ||
                "Memory save error"
            );
        }

        await loadMemories();

        return true;

    } catch (error) {

        console.error(
            "Memory save error:",
            error
        );

        return false;
    }
}


/* ================================
   Geminiへ送る最終テキスト
   ================================ */

function buildGeminiPrompt(text) {

    const memoryContext =
        buildMemoryContext();

    return `
あなたはJ.A.R.V.I.S.です。

以下は真人さんについて保存されている長期記憶です。
回答に関連する場合のみ自然に利用してください。
記憶にないことは推測せず、分からない場合は分からないと答えてください。

--- 長期記憶 ---
${memoryContext}
--- 長期記憶ここまで ---

今回の真人さんの発言：
${text}
`;
}


/* ================================
   Gemini TTSのPCM音声をWAVに変換
   ================================ */

function pcmToWav(base64) {

    const binary = atob(base64);

    const pcm = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        pcm[i] = binary.charCodeAt(i);
    }

    const sampleRate = 24000;
    const channels = 1;
    const bitsPerSample = 16;

    const byteRate =
        sampleRate *
        channels *
        bitsPerSample / 8;

    const blockAlign =
        channels *
        bitsPerSample / 8;

    const buffer =
        new ArrayBuffer(44 + pcm.length);

    const view =
        new DataView(buffer);

    function writeString(offset, string) {

        for (let i = 0; i < string.length; i++) {

            view.setUint8(
                offset + i,
                string.charCodeAt(i)
            );

        }
    }

    writeString(0, "RIFF");

    view.setUint32(
        4,
        36 + pcm.length,
        true
    );

    writeString(8, "WAVE");
    writeString(12, "fmt ");

    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, channels, true);

    view.setUint32(
        24,
        sampleRate,
        true
    );

    view.setUint32(
        28,
        byteRate,
        true
    );

    view.setUint16(
        32,
        blockAlign,
        true
    );

    view.setUint16(
        34,
        bitsPerSample,
        true
    );

    writeString(36, "data");

    view.setUint32(
        40,
        pcm.length,
        true
    );

    new Uint8Array(buffer, 44).set(pcm);

    return new Blob(
        [buffer],
        { type: "audio/wav" }
    );
}


/* ================================
   音声認識開始
   ================================ */

function startListening() {

    if (!conversationActive) {
        return;
    }

    if (recognitionRunning) {
        return;
    }

    if (!recognition) {

        status.textContent =
            "音声認識を初期化できません";

        return;
    }

    try {

        status.textContent =
            "聞いています…";

        recognitionRunning = true;

        recognition.start();

    } catch (error) {

        recognitionRunning = false;

        status.textContent =
            "音声認識開始エラー：" +
            getErrorMessage(error);
    }
}


/* ================================
   Gemini TTS
   ================================ */

async function speakWithGemini(text) {

    status.textContent =
        "J.A.R.V.I.S. 音声生成中…";

    diagnostic.style.display = "none";
    diagnostic.textContent = "";

    const controller =
        new AbortController();

    const timeout =
        setTimeout(() => {

            controller.abort();

        }, 240000);

    try {

        const response =
            await fetch("/api/tts", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    text: text
                }),

                signal: controller.signal

            });

        clearTimeout(timeout);

        const data =
            await response.json();


        if (data.diagnostic === true) {

            status.textContent =
                "TTS診断完了";

            diagnostic.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );

            diagnostic.style.display =
                "block";

            return;
        }


        if (!response.ok) {

            throw new Error(
                getErrorMessage(data.error) ||
                "TTS HTTP " + response.status
            );
        }


        if (!data.audio) {

            throw new Error(
                "音声データがありません"
            );
        }


        const wav =
            pcmToWav(data.audio);

        const arrayBuffer =
            await wav.arrayBuffer();

        const audioBuffer =
            await audioContext.decodeAudioData(
                arrayBuffer
            );


        if (currentSource) {

            try {
                currentSource.stop();
            } catch (e) {}

            currentSource = null;
        }


        currentSource =
            audioContext.createBufferSource();

        currentSource.buffer =
            audioBuffer;

        currentSource.connect(
            audioContext.destination
        );


        await new Promise(resolve => {

            currentSource.onended = () => {

                currentSource = null;

                resolve();

            };

            status.textContent =
                "J.A.R.V.I.S. 発話中…";

            currentSource.start();

        });


        if (conversationActive) {

            status.textContent =
                "次の入力を待っています…";

            await new Promise(
                resolve =>
                    setTimeout(resolve, 300)
            );

            startListening();
        }

    } catch (error) {

        clearTimeout(timeout);

        if (error.name === "AbortError") {

            status.textContent =
                "エラー：音声生成がタイムアウトしました";

        } else {

            status.textContent =
                "音声エラー：" +
                getErrorMessage(error);

        }
    }
}


/* ================================
   音声認識初期化
   ================================ */

if (!SpeechRecognition) {

    status.textContent =
        "音声認識に対応していません";

} else {

    recognition =
        new SpeechRecognition();

    recognition.lang = "ja-JP";
    recognition.continuous = false;
    recognition.interimResults = false;


    /* ================================
       会話開始 / 終了
       ================================ */

    button.addEventListener(
        "click",
        async () => {

            if (!audioContext) {

                audioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();
            }

            await audioContext.resume();


            if (conversationActive) {

                conversationActive = false;

                if (recognitionRunning) {

                    try {
                        recognition.stop();
                    } catch (e) {}

                }

                recognitionRunning = false;


                if (currentSource) {

                    try {
                        currentSource.stop();
                    } catch (e) {}

                    currentSource = null;
                }

                status.textContent =
                    "待機中";

                button.textContent =
                    "🎙️ 話す";

                return;
            }


            /* 会話開始時に最新記憶を取得 */

            status.textContent =
                "記憶を読み込んでいます…";

            await loadMemories();


            conversationActive = true;

            button.textContent =
                "⏹️ 終了";

            startListening();

        }
    );


    /* ================================
       音声認識結果
       ================================ */

    recognition.onresult =
        async (event) => {

            recognitionRunning = false;

            const text =
                event.results[0][0].transcript;

            status.textContent =
                "認識：「" +
                text +
                "」";


            await new Promise(
                resolve =>
                    setTimeout(resolve, 300)
            );


            if (!conversationActive) {
                return;
            }


            /* ================================
               明示的な記憶保存
               ================================ */

            if (isMemoryRequest(text)) {

                status.textContent =
                    "記憶しています…";

                const saved =
                    await saveMemory(text);

                if (saved) {

                    status.textContent =
                        "記憶しました";

                } else {

                    status.textContent =
                        "記憶の保存に失敗しました";
                }


                if (conversationActive) {

                    await new Promise(
                        resolve =>
                            setTimeout(resolve, 500)
                    );

                    startListening();
                }

                return;
            }


            /* ================================
               Gemini
               ================================ */

            status.textContent =
                "Geminiへ送信中…";


            try {

                const controller =
                    new AbortController();

                const timeout =
                    setTimeout(() => {

                        controller.abort();

                    }, 240000);


                const response =
                    await fetch("/api/gemini", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            text:
                                buildGeminiPrompt(text)
                        }),

                        signal: controller.signal

                    });


                clearTimeout(timeout);


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        getErrorMessage(data.error) ||
                        "Gemini HTTP " +
                        response.status
                    );
                }


                if (!data.text) {

                    throw new Error(
                        "Geminiから回答テキストがありません"
                    );
                }


                status.textContent =
                    "J.A.R.V.I.S.：「" +
                    data.text +
                    "」";


                await speakWithGemini(
                    data.text
                );


            } catch (error) {

                clearTimeout(timeout);

                if (
                    error.name ===
                    "AbortError"
                ) {

                    status.textContent =
                        "エラー：Geminiへの接続がタイムアウトしました";

                } else {

                    status.textContent =
                        "エラー：" +
                        getErrorMessage(error);

                }
            }
        };


    /* ================================
       音声認識エラー
       ================================ */

    recognition.onerror =
        (event) => {

            recognitionRunning = false;

            status.textContent =
                "音声認識エラー：" +
                event.error;


            if (
                conversationActive &&
                event.error !== "not-allowed" &&
                event.error !== "service-not-allowed"
            ) {

                setTimeout(() => {

                    startListening();

                }, 500);

            }
        };


    /* ================================
       音声認識終了
       ================================ */

    recognition.onend =
        () => {

            recognitionRunning = false;

        };

}


/* ================================
   起動時に記憶を先読み
   ================================ */

loadMemories();

</script>

</body>
</html>
