<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>

<style>
body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 60px;
    font-size: 32px;
    letter-spacing: 6px;
}

#modeSelector {
    margin-top: 35px;
    display: flex;
    justify-content: center;
    gap: 8px;
}

.modeButton {
    width: 85px;
    height: 40px;
    margin: 0;
    border-radius: 20px;
    border: 1px solid #555;
    background: #111;
    color: #aaa;
    font-size: 13px;
}

.modeButton.active {
    background: #333;
    color: white;
    border-color: #aaa;
}

#talkButton {
    margin-top: 70px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 2px solid #555;
    background: #111;
    color: white;
    font-size: 20px;
}

#talkButton:active {
    background: #333;
}

#textArea {
    display: none;
    margin: 40px auto 0;
    width: calc(100% - 50px);
    max-width: 600px;
}

#textInput {
    width: 100%;
    box-sizing: border-box;
    min-height: 100px;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #444;
    background: #111;
    color: white;
    font-size: 16px;
    resize: vertical;
}

#sendButton {
    width: 120px;
    height: 45px;
    margin-top: 12px;
    border-radius: 22px;
    border: 1px solid #555;
    background: #222;
    color: white;
    font-size: 15px;
}

#response {
    margin: 30px 20px 0;
    color: white;
    padding: 0 10px;
    word-break: break-word;
    line-height: 1.7;
}

#status {
    margin-top: 20px;
    color: #aaa;
    padding: 0 20px;
    word-break: break-word;
}

#diagnostic {
    display: none;
    margin: 30px 20px;
    padding: 15px;
    background: #111;
    border: 1px solid #444;
    border-radius: 10px;
    color: #ddd;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.5;
    max-height: 500px;
    overflow-y: auto;
}
</style>
</head>

<body>

<h1>J.A.R.V.I.S.</h1>

<div id="modeSelector">

    <button
        class="modeButton active"
        data-mode="voice"
    >
        VOICE
    </button>

    <button
        class="modeButton"
        data-mode="text"
    >
        TEXT
    </button>

    <button
        class="modeButton"
        data-mode="auto"
    >
        AUTO
    </button>

</div>

<button id="talkButton">🎙️ 話す</button>

<div id="textArea">

    <textarea
        id="textInput"
        placeholder="J.A.R.V.I.S.に話しかける内容を入力"
    ></textarea>

    <br>

    <button id="sendButton">
        送信
    </button>

</div>

<div id="response"></div>

<div id="status">
    待機中
</div>

<pre id="diagnostic"></pre>

<script>

const button =
    document.getElementById("talkButton");

const status =
    document.getElementById("status");

const responseArea =
    document.getElementById("response");

const diagnostic =
    document.getElementById("diagnostic");

const textArea =
    document.getElementById("textArea");

const textInput =
    document.getElementById("textInput");

const sendButton =
    document.getElementById("sendButton");

const modeButtons =
    document.querySelectorAll(".modeButton");


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let audioContext = null;
let currentSource = null;

let conversationActive = false;
let recognitionRunning = false;
let recognition = null;

let memories = [];

let previousInteractionId = null;


/* ================================
   モード
   ================================ */

let currentMode = "voice";


/* ================================
   J.A.R.V.I.S. 音声後処理設定
   ================================ */

const VOICE_PROCESSING = {

    // 声の不要な低域を軽く整理
    highpassFrequency: 65,

    // 高域を削りすぎない
    lowpassFrequency: 14500,

    // ごく薄いSaturation
    saturationAmount: 0.025,

    // 音量の安定化
    compressorThreshold: -18,
    compressorKnee: 12,
    compressorRatio: 2.2,
    compressorAttack: 0.008,
    compressorRelease: 0.12,

    // 最終出力
    outputGain: 0.92
};


/* ================================
   軽いSaturation用WaveShaper
   ================================ */

function createVoiceSaturation(context) {

    const shaper =
        context.createWaveShaper();

    const amount =
        VOICE_PROCESSING.saturationAmount;

    const samples = 2048;

    const curve =
        new Float32Array(samples);

    for (
        let i = 0;
        i < samples;
        i++
    ) {

        const x =
            (i * 2) / (samples - 1) - 1;

        curve[i] =
            Math.tanh(
                x * (1 + amount * 8)
            ) /
            Math.tanh(
                1 + amount * 8
            );
    }

    shaper.curve = curve;

    shaper.oversample = "2x";

    return shaper;
}


/* ================================
   J.A.R.V.I.S. 音声処理チェーン
   ================================ */

function createVoiceProcessingChain(context) {

    const highpass =
        context.createBiquadFilter();

    highpass.type =
        "highpass";

    highpass.frequency.value =
        VOICE_PROCESSING.highpassFrequency;

    highpass.Q.value =
        0.7;


    const lowpass =
        context.createBiquadFilter();

    lowpass.type =
        "lowpass";

    lowpass.frequency.value =
        VOICE_PROCESSING.lowpassFrequency;

    lowpass.Q.value =
        0.35;


    const saturation =
        createVoiceSaturation(
            context
        );


    const compressor =
        context.createDynamicsCompressor();

    compressor.threshold.value =
        VOICE_PROCESSING.compressorThreshold;

    compressor.knee.value =
        VOICE_PROCESSING.compressorKnee;

    compressor.ratio.value =
        VOICE_PROCESSING.compressorRatio;

    compressor.attack.value =
        VOICE_PROCESSING.compressorAttack;

    compressor.release.value =
        VOICE_PROCESSING.compressorRelease;


    const outputGain =
        context.createGain();

    outputGain.gain.value =
        VOICE_PROCESSING.outputGain;


    highpass.connect(
        lowpass
    );

    lowpass.connect(
        saturation
    );

    saturation.connect(
        compressor
    );

    compressor.connect(
        outputGain
    );

    outputGain.connect(
        context.destination
    );


    return {
        input: highpass,
        output: outputGain
    };
}


/* ================================
   エラーを安全に文字列化
   ================================ */

function getErrorMessage(error) {

    if (typeof error === "string") {
        return error;
    }

    if (error && typeof error === "object") {

        if (error.message) {
            return error.message;
        }

        try {
            return JSON.stringify(error);
        } catch (e) {
            return "不明なエラー";
        }
    }

    return String(error);
}


/* ================================
   モード切替
   ================================ */

function setMode(mode) {

    if (
        mode !== "voice" &&
        mode !== "text" &&
        mode !== "auto"
    ) {
        return;
    }

    currentMode = mode;


    modeButtons.forEach(
        (modeButton) => {

            modeButton.classList.toggle(
                "active",
                modeButton.dataset.mode === mode
            );

        }
    );


    if (mode === "text") {

        textArea.style.display =
            "block";

        button.style.display =
            "none";

        if (conversationActive) {

            if (recognitionRunning) {

                try {
                    recognition.stop();
                } catch (e) {}

            }

            recognitionRunning =
                false;
        }

        status.textContent =
            "文字入力モード";

    } else {

        textArea.style.display =
            "none";

        button.style.display =
            "inline-block";

        if (mode === "voice") {

            button.textContent =
                conversationActive
                    ? "⏹️ 終了"
                    : "🎙️ 話す";

            if (conversationActive) {
                status.textContent =
                    "音声入力モード";
            }

        } else {

            button.textContent =
                conversationActive
                    ? "⏹️ 終了"
                    : "⚡ AUTO";

            if (conversationActive) {
                status.textContent =
                    "自動モード";
            }
        }
    }
}


/* ================================
   長期記憶を取得
   ================================ */

async function loadMemories() {

    try {

        const response =
            await fetch("/api/memory", {
                method: "GET"
            });

        const data =
            await response.json();

        if (!response.ok || !data.ok) {

            throw new Error(
                getErrorMessage(data.error) ||
                "Memory GET error"
            );

        }

        memories =
            Array.isArray(data.memories)
                ? data.memories.slice(0, 30)
                : [];

        return memories;

    } catch (error) {

        console.error(
            "Memory load error:",
            error
        );

        memories = [];

        return [];
    }
}


/* ================================
   長期記憶をGemini用テキストへ変換
   ================================ */

function buildMemoryContext() {

    if (!memories.length) {

        return "現在、登録されている長期記憶はありません。";

    }

    return memories
        .map((memory, index) => {

            return (
                `${index + 1}. ` +
                `[${memory.category}] ` +
                `${memory.content}`
            );

        })
        .join("\n");
}


/* ================================
   Geminiへ送る最終テキスト
   ================================ */

function buildGeminiPrompt(text) {

    const memoryContext =
        buildMemoryContext();

    return `
あなたは真人さん専用のAIアシスタント、J.A.R.V.I.S.です。

以下は真人さんについて保存されている長期記憶です。
今回の会話に関連する場合のみ自然に利用してください。
記憶にないことは推測しないでください。

--- 長期記憶 ---
${memoryContext}
--- 長期記憶ここまで ---

今回の真人さんの発言：
${text}

以下のルールで判断してください。

1. 真人さんの発言への自然な回答を「reply」に入れてください。
2. 今後の会話でも長期的に役立つ情報なら「memory.shouldSave」をtrueにしてください。
3. 一時的な発言、雑談、その場限りの情報は保存しないでください。
4. 「覚えて」「記憶して」など明示的に保存を求められた場合は、保存対象として扱ってください。
5. 保存する場合は、発言そのものではなく、今後利用しやすい簡潔な事実として「memory.content」にしてください。
6. カテゴリは以下から選択してください。
   - personal
   - preference
   - work
   - family
   - goal
7. 重要度は1〜5で設定してください。
8. 保存しない場合は「memory.shouldSave」をfalseにしてください。
9. 保存しない場合でも「reply」は通常どおり自然に回答してください。
`;
}


/* ================================
   長期記憶を保存
   ================================ */

async function saveMemory(memory) {

    if (!memory || !memory.shouldSave) {
        return false;
    }

    const content =
        typeof memory.content === "string"
            ? memory.content.trim()
            : "";

    if (!content) {
        return false;
    }

    const category =
        [
            "personal",
            "preference",
            "work",
            "family",
            "goal"
        ].includes(memory.category)
            ? memory.category
            : "personal";

    const importance =
        Number.isInteger(memory.importance)
            ? Math.min(
                5,
                Math.max(
                    1,
                    memory.importance
                )
            )
            : 1;

    try {

        const response =
            await fetch("/api/memory", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    category: category,
                    content: content,
                    importance: importance
                })
            });

        const data =
            await response.json();

        if (!response.ok || !data.ok) {

            throw new Error(
                getErrorMessage(data.error) ||
                "Memory save error"
            );

        }

        await loadMemories();

        return true;

    } catch (error) {

        console.error(
            "Memory save error:",
            error
        );

        return false;
    }
}


/* ================================
   PCM → WAV
   ================================ */

function pcmToWav(base64) {

    const binary =
        atob(base64);

    const pcm =
        new Uint8Array(
            binary.length
        );

    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        pcm[i] =
            binary.charCodeAt(i);

    }

    const sampleRate = 24000;
    const channels = 1;
    const bitsPerSample = 16;

    const byteRate =
        sampleRate *
        channels *
        bitsPerSample / 8;

    const blockAlign =
        channels *
        bitsPerSample / 8;

    const buffer =
        new ArrayBuffer(
            44 + pcm.length
        );

    const view =
        new DataView(buffer);

    function writeString(
        offset,
        string
    ) {

        for (
            let i = 0;
            i < string.length;
            i++
        ) {

            view.setUint8(
                offset + i,
                string.charCodeAt(i)
            );

        }
    }

    writeString(0, "RIFF");

    view.setUint32(
        4,
        36 + pcm.length,
        true
    );

    writeString(8, "WAVE");
    writeString(12, "fmt ");

    view.setUint32(
        16,
        16,
        true
    );

    view.setUint16(
        20,
        1,
        true
    );

    view.setUint16(
        22,
        channels,
        true
    );

    view.setUint32(
        24,
        sampleRate,
        true
    );

    view.setUint32(
        28,
        byteRate,
        true
    );

    view.setUint16(
        32,
        blockAlign,
        true
    );

    view.setUint16(
        34,
        bitsPerSample,
        true
    );

    writeString(
        36,
        "data"
    );

    view.setUint32(
        40,
        pcm.length,
        true
    );

    new Uint8Array(
        buffer,
        44
    ).set(pcm);

    return new Blob(
        [buffer],
        {
            type: "audio/wav"
        }
    );
}


/* ================================
   音声認識開始
   ================================ */

function startListening() {

    if (!conversationActive) {
        return;
    }

    if (currentMode === "text") {
        return;
    }

    if (recognitionRunning) {
        return;
    }

    if (!recognition) {

        if (currentMode === "auto") {

            textArea.style.display =
                "block";

            button.style.display =
                "none";

            status.textContent =
                "音声認識が使えないため文字入力に切り替えました";

            return;
        }

        status.textContent =
            "音声認識を初期化できません";

        return;
    }

    try {

        status.textContent =
            "聞いています…";

        recognitionRunning =
            true;

        recognition.start();

    } catch (error) {

        recognitionRunning =
            false;

        status.textContent =
            "音声認識開始エラー：" +
            getErrorMessage(error);
    }
}


/* ================================
   Gemini TTS
   ================================ */

async function speakWithGemini(text) {

    status.textContent =
        "J.A.R.V.I.S. 音声生成中…";

    diagnostic.style.display =
        "none";

    diagnostic.textContent =
        "";

    const controller =
        new AbortController();

    const timeout =
        setTimeout(() => {

            controller.abort();

        }, 240000);

    try {

        const response =
            await fetch("/api/tts", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    text: text
                }),

                signal:
                    controller.signal

            });

        clearTimeout(timeout);

        const data =
            await response.json();


        if (data.diagnostic === true) {

            status.textContent =
                "TTS診断完了";

            diagnostic.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );

            diagnostic.style.display =
                "block";

            return false;
        }


        if (!response.ok) {

            throw new Error(
                getErrorMessage(data.error) ||
                "TTS HTTP " +
                response.status
            );

        }


        if (!data.audio) {

            throw new Error(
                "音声データがありません"
            );

        }


        const wav =
            pcmToWav(data.audio);

        const arrayBuffer =
            await wav.arrayBuffer();

        const audioBuffer =
            await audioContext.decodeAudioData(
                arrayBuffer
            );


        if (currentSource) {

            try {
                currentSource.stop();
            } catch (e) {}

            currentSource = null;
        }


        /*
         * ================================
         * J.A.R.V.I.S. 音声後処理
         * ================================
         */

        const processing =
            createVoiceProcessingChain(
                audioContext
            );


        currentSource =
            audioContext.createBufferSource();

        currentSource.buffer =
            audioBuffer;


        /*
         * TTS音声を直接再生せず、
         * 後処理チェーンへ送る。
         */

        currentSource.connect(
            processing.input
        );


        await new Promise(resolve => {

            currentSource.onended =
                () => {

                    currentSource = null;

                    resolve();

                };

            status.textContent =
                "J.A.R.V.I.S. 発話中…";

            currentSource.start();

        });

        return true;

    } catch (error) {

        clearTimeout(timeout);

        console.error(
            "TTS error:",
            error
        );

        return false;
    }
}


/* ================================
   Gemini処理
   ================================ */

async function sendToGemini(text) {

    const cleanText =
        typeof text === "string"
            ? text.trim()
            : "";

    if (!cleanText) {
        return;
    }

    if (!conversationActive) {
        return;
    }


    status.textContent =
        "Geminiへ送信中…";


    try {

        const controller =
            new AbortController();

        const timeout =
            setTimeout(() => {

                controller.abort();

            }, 240000);


        const response =
            await fetch(
                "/api/gemini",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        text:
                            buildGeminiPrompt(
                                cleanText
                            ),

                        previousInteractionId:
                            previousInteractionId

                    }),

                    signal:
                        controller.signal

                }
            );


        clearTimeout(timeout);


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                getErrorMessage(
                    data.error
                ) ||
                "Gemini HTTP " +
                response.status
            );

        }


        if (!data.text) {

            throw new Error(
                "Geminiから回答テキストがありません"
            );

        }


        /* ================================
           短期会話ID更新
           ================================ */

        if (data.interactionId) {

            previousInteractionId =
                data.interactionId;

        }


        /* ================================
           長期記憶
           ================================ */

        if (
            data.memory &&
            data.memory.shouldSave === true
        ) {

            status.textContent =
                "記憶しています…";


            const saved =
                await saveMemory(
                    data.memory
                );


            if (saved) {

                status.textContent =
                    "記憶しました";

            } else {

                status.textContent =
                    "記憶の保存に失敗しました";
            }


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        500
                    )
            );

        }


        /* ================================
           回答表示
           ================================ */

        responseArea.textContent =
            data.text;


        /* ================================
           TEXTモード
           ================================ */

        if (currentMode === "text") {

            status.textContent =
                "回答完了";

            return;
        }


        /* ================================
           VOICE / AUTO
           ================================ */

        status.textContent =
            "J.A.R.V.I.S. 音声生成中…";


        const spoken =
            await speakWithGemini(
                data.text
            );


        /* ================================
           TTS失敗時
           ================================ */

        if (!spoken) {

            status.textContent =
                "音声生成に失敗しました。回答は画面に表示しています。";

            return;
        }


        /* ================================
           次の入力
           ================================ */

        if (conversationActive) {

            status.textContent =
                "次の入力を待っています…";


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        150
                    )
            );


            if (conversationActive) {
                startListening();
            }
        }

    } catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            status.textContent =
                "エラー：Geminiへの接続がタイムアウトしました";

        } else {

            status.textContent =
                "エラー：" +
                getErrorMessage(error);

        }
    }
}


/* ================================
   音声認識初期化
   ================================ */

if (!SpeechRecognition) {

    if (currentMode === "voice") {

        status.textContent =
            "音声認識に対応していません";

    }

} else {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "ja-JP";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    /* ================================
       音声認識結果
       ================================ */

    recognition.onresult =
        async (event) => {

            recognitionRunning =
                false;

            const text =
                event.results[0][0].transcript;


            status.textContent =
                "認識：「" +
                text +
                "」";


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        300
                    )
            );


            if (!conversationActive) {
                return;
            }


            await sendToGemini(text);
        };


    /* ================================
       音声認識エラー
       ================================ */

    recognition.onerror =
        (event) => {

            recognitionRunning =
                false;


            if (
                currentMode === "auto"
            ) {

                textArea.style.display =
                    "block";

                button.style.display =
                    "none";

                status.textContent =
                    "音声入力を使用できないため、文字入力に切り替えました";

                return;
            }


            status.textContent =
                "音声認識エラー：" +
                event.error;


            if (
                conversationActive &&
                event.error !== "not-allowed" &&
                event.error !== "service-not-allowed"
            ) {

                setTimeout(() => {

                    startListening();

                }, 500);

            }
        };


    /* ================================
       音声認識終了
       ================================ */

    recognition.onend =
        () => {

            recognitionRunning =
                false;

            // J.A.R.V.I.S.発話後の
            // 自動再開は sendToGemini() が担当する。
            // ここでは勝手に再開しない。
        };

}


/* ================================
   会話開始 / 終了
   ================================ */

button.addEventListener(
    "click",
    async () => {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        await audioContext.resume();


        if (conversationActive) {

            conversationActive =
                false;


            if (recognitionRunning) {

                try {
                    recognition.stop();
                } catch (e) {}

            }

            recognitionRunning =
                false;


            if (currentSource) {

                try {
                    currentSource.stop();
                } catch (e) {}

                currentSource = null;
            }


            previousInteractionId =
                null;


            status.textContent =
                "待機中";

            button.textContent =
                currentMode === "auto"
                    ? "⚡ AUTO"
                    : "🎙️ 話す";

            return;
        }


        status.textContent =
            "記憶を読み込んでいます…";


        await loadMemories();


        previousInteractionId =
            null;


        conversationActive =
            true;


        button.textContent =
            "⏹️ 終了";


        startListening();

    }
);


/* ================================
   TEXT送信
   ================================ */

sendButton.addEventListener(
    "click",
    async () => {

        const text =
            textInput.value.trim();

        if (!text) {
            return;
        }


        if (!conversationActive) {

            await loadMemories();

            previousInteractionId =
                null;

            conversationActive =
                true;
        }


        textInput.value =
            "";


        await sendToGemini(text);
    }
);


/* ================================
   Enter送信
   ================================ */

textInput.addEventListener(
    "keydown",
    async (event) => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendButton.click();
        }
    }
);


/* ================================
   モードボタン
   ================================ */

modeButtons.forEach(
    (modeButton) => {

        modeButton.addEventListener(
            "click",
            () => {

                setMode(
                    modeButton.dataset.mode
                );

            }
        );

    }
);


/* ================================
   初期化
   ================================ */

setMode("voice");

loadMemories();

</script>

</body>
