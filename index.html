<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>J.A.R.V.I.S. Core Terminal</title>
<script src="https://tailwindcss.com"></script>
<style>
/* 映画の研究所のように完全に真っ黒な背景 */
body {
    margin: 0;
    background-color: #000000;
    color: #00e5ff;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
}

/* 画像にあった「強烈な青いネオンの発光（グロー）」を再現 */
.glow-cyan {
    filter: drop-shadow(0 0 5px #00b9ff) drop-shadow(0 0 15px #0055ff);
}
.glow-text {
    color: #ffffff;
    text-shadow: 0 0 4px #fff, 0 0 10px #00d2ff, 0 0 20px #0044ff;
}

/* 多層リングをそれぞれ違う速度で滑らかに回転させる */
.rotate-fast { animation: spin-clockwise 3s linear infinite; transform-origin: 300px 300px; }
.rotate-medium { animation: spin-counter 7s linear infinite; transform-origin: 300px 300px; }
.rotate-slow { animation: spin-clockwise 12s linear infinite; transform-origin: 300px 300px; }
.rotate-outer { animation: spin-counter 20s linear infinite; transform-origin: 300px 300px; }

@keyframes spin-clockwise { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes spin-counter { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

/* ボスの声を聴いている（マイク起動中）の警告アラート発光（赤） */
.listening-state .glow-cyan {
    filter: drop-shadow(0 0 6px #ff0055) drop-shadow(0 0 20px #ff0000);
}
.listening-state .glow-text {
    color: #ff3377;
    text-shadow: 0 0 4px #fff, 0 0 10px #ff0055, 0 0 25px #ff0000;
}
.listening-state .core-ring-main { stroke: #ff0055; }
.listening-state .core-ring-pulse { stroke: #ff3377; }
</style>
</head>
<body class="h-screen flex flex-col justify-between p-4 select-none">

    <!-- HUDヘッダー（近未来ステータス） -->
    <header class="w-full flex justify-between items-center px-4 py-2 border-b border-cyan-950/40 text-[10px] tracking-widest text-cyan-500/70">
        <div>SYS_LOC: ANCHOR_CORE</div>
        <div id="status" class="text-cyan-400 font-bold animate-pulse">STATUS: ONLINE</div>
        <div>SECURE_LINE_V2</div>
    </header>

    <!-- メイン：画像通りの3~4列の電子アークリアクター -->
    <main class="flex-1 flex flex-col items-center justify-center relative">
        <!-- 背景に薄く流れるシステムログ -->
        <div id="sys-log" class="absolute top-2 text-[9px] text-cyan-900/60 text-center pointer-events-none w-full max-h-[60px] overflow-hidden">
            INITIALIZING MATRIX... CONNECTED TO GEMINI_FLASH_MODEL... Ready.
        </div>

        <!-- タップ可能なJARVISコア本体 -->
        <button id="jarvisCore" class="w-[290px] h-[290px] bg-transparent focus:outline-none active:scale-95 transition-transform relative">
            <svg viewBox="0 0 600 600" class="w-full h-full overflow-visible">
                <!-- 漆黒のコアベース -->
                <circle cx="300" cy="300" r="240" fill="#000000" />
                
                <!-- 列4：最外周のクリアブルーの電子目盛りリング -->
                <g class="rotate-outer glow-cyan">
                    <circle cx="300" cy="300" r="235" fill="none" stroke="#0044ff" stroke-width="1" stroke-dasharray="2 6" opacity="0.5"/>
                    <circle cx="300" cy="300" r="225" fill="none" stroke="#00b9ff" stroke-width="2" stroke-dasharray="40 180 20 40" />
                </g>

                <!-- 列3：濃い青の極細ダッシュリング -->
                <g class="rotate-slow glow-cyan">
                    <circle cx="300" cy="300" r="195" fill="none" stroke="#0022cc" stroke-width="1.5" stroke-dasharray="6 4" />
                    <circle cx="300" cy="300" r="185" fill="none" stroke="#00b9ff" stroke-width="1" stroke-dasharray="150 20" opacity="0.7" />
                </g>

                <!-- 列2：クリアブルー＆白が混ざるメインアークセクター -->
                <g class="rotate-medium glow-cyan">
                    <circle class="core-ring-main" cx="300" cy="300" r="155" fill="none" stroke="#00d2ff" stroke-width="4" stroke-dasharray="80 20 40 30 120 40" />
                    <circle cx="300" cy="300" r="145" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.5" stroke-dasharray="10 10" />
                </g>

                <!-- 列1：中心の最も強い光を発するインナーコア -->
                <g class="rotate-fast glow-cyan">
                    <circle class="core-ring-pulse" cx="300" cy="300" r="110" fill="none" stroke="#00d2ff" stroke-width="3" />
                    <circle cx="300" cy="300" r="98" fill="none" stroke="#0044ff" stroke-width="2" stroke-dasharray="4 8" />
                </g>
                
                <!-- コアの中心文字「JARVIS」強烈なグロー効果 -->
                <text id="core-text" class="glow-text font-sans font-black tracking-[0.2em]" x="300" y="308" text-anchor="middle" font-size="38">JARVIS</text>
            </svg>
        </button>
    </main>

    <!-- フッター：映画のホログラム字幕風のテキスト領域 -->
    <footer class="w-full flex flex-col items-center justify-center pb-6 gap-4">
        <!-- ボスの声とJARVISの応答が浮かび上がるシネマティックエリア -->
        <div id="response" class="text-center text-sm font-sans font-medium max-w-xs text-cyan-100 min-h-[45px] px-4 drop-shadow-[0_0_10px_rgba(0,229,255,0.8)]">
            パワードスーツの準備はいつでも万全です、ボス。
        </div>

        <!-- APIキー入力（LocalStorageに保存されるため、流出せず安全です） -->
        <div class="w-full max-w-xs opacity-15 hover:opacity-90 transition-opacity">
            <input type="password" id="api-key-input" placeholder="ENTER GEMINI_API_KEY" class="w-full bg-black border border-cyan-950 rounded px-3 py-1.5 text-[9px] text-center text-cyan-400 focus:outline-none focus:border-cyan-500 tracking-widest">
        </div>
    </footer>

    <script>
        const jarvisCore = document.getElementById('jarvisCore');
        const coreText = document.getElementById('core-text');
        const statusText = document.getElementById('status');
        const responseDiv = document.getElementById('response');
        const apiKeyInput = document.getElementById('api-key-input');
        const sysLog = document.getElementById('sys-log');

        if (localStorage.getItem('gemini_key')) {
            apiKeyInput.value = localStorage.getItem('gemini_key');
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
        } else {
            responseDiv.innerText = "ブラウザが音声認識に対応していません。Safariで開いてください。";
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'ja-JP';
            uttr.pitch = 0.86; // 重厚な執事の声
            uttr.rate = 1.05;
            window.speechSynthesis.speak(uttr);
        }

        function log(msg) {
            sysLog.innerHTML = `<div>>> ${msg}</div>` + sysLog.innerHTML;
        }

        if (recognition) {
            // コアをタップして音声入力を開始
            jarvisCore.addEventListener('click', () => {
                window.speechSynthesis.cancel();
                recognition.start();
            });

            recognition.onstart = () => {
                document.body.classList.add('listening-state');
                coreText.textContent = "LISTEN";
                statusText.innerText = "STATUS: VOICE_CAPTURING";
                statusText.className = "text-red-500 font-bold animate-pulse";
                responseDiv.innerText = "ボスの声を解析中...";
                log("VOICE CAPTURE STARTED");
            };

            recognition.onend = () => {
                document.body.classList.remove('listening-state');
                coreText.textContent = "JARVIS";
                statusText.className = "text-cyan-400 font-bold animate-pulse";
            };

            recognition.onresult = async (event) => {
                const userText = event.results.transcript;
                responseDiv.innerText = `「 ${userText} 」`;
                statusText.innerText = "STATUS: GEMINI_THINKING";
                log(`USER_INPUT: ${userText}`);

                const key = apiKeyInput.value.trim();
                localStorage.setItem('gemini_key', key);

                if (!key) {
                    const errMsg = "APIキーがロードされていません、ボス。";
                    responseDiv.innerText = errMsg;
                    speak(errMsg);
                    statusText.innerText = "STATUS: ERROR";
                    return;
                }

                try {
                    // 最新の超高速モデル Gemini 2.5 Flash API に直結
                    const res = await fetch(`https://googleapis.com{key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `あなたは映画アイアンマンのAIアシスタント「JARVIS」です。主人である「ボス」に忠実に、最高に知的で簡潔な大人のセリフ（1〜2文）で答えてください。語尾は必ず「〜です、ボス」「〜でしょうか、ボス」にしてください。質問：${userText}` }] }]
                        })
                    });

                    const data = await res.json();
                    const aiText = data.candidates.content.parts.text;

                    responseDiv.innerText = aiText;
                    statusText.innerText = "STATUS: ONLINE";
                    log(`JARVIS_RESPONSE: SUCCESS`);
                    speak(aiText);

                } catch (err) {
                    console.error(err);
                    const errMsg = "申し訳ありません、メインサーバーとの通信に失敗しました。";
                    responseDiv.innerText = errMsg;
                    speak(errMsg);
                    statusText.innerText = "STATUS: LINK_DOWN";
                    log("API_FETCH_ERROR");
                }
            };
        }
    </script>
</body>
</html>
