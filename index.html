<script>

const button =
    document.getElementById("talkButton");

const status =
    document.getElementById("status");

const responseArea =
    document.getElementById("response");

const diagnostic =
    document.getElementById("diagnostic");

const textArea =
    document.getElementById("textArea");

const textInput =
    document.getElementById("textInput");

const sendButton =
    document.getElementById("sendButton");

const modeButtons =
    document.querySelectorAll(".modeButton");


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let audioContext = null;
let currentSource = null;

let conversationActive = false;
let recognitionRunning = false;
let recognition = null;

let memories = [];

let previousInteractionId = null;

let currentMode = "voice";


/* =========================================================
   J.A.R.V.I.S. FINAL VOICE ENGINE
   =========================================================

   今回は「軽い後処理」ではない。

   Charon
      ↓
   High Pass
      ↓
   Low / Low-Mid body reconstruction
      ↓
   Presence control
      ↓
   Air reduction
      ↓
   Non-linear coloration
      ↓
   Main compression
      ↓
   Density compression
      ↓
   Final tone shaping
      ↓
   Output

   目的：
   Charonの明るいアナウンサー的な質感を可能な限り削り、
   成熟した映画吹替系AI音声の音像へ変換する。
   ========================================================= */

const VOICE_PROCESSING = {

    /*
     * 不要な超低域を整理
     */
    highpassFrequency: 55,

    /*
     * アナウンサー感の原因になりやすい
     * 上方向の明るさをかなり抑える
     */
    lowpassFrequency: 9200,

    /*
     * Low body
     */
    lowBodyFrequency: 145,
    lowBodyGain: 4.5,

    /*
     * Low-mid body
     */
    lowMidFrequency: 330,
    lowMidGain: 3.8,

    /*
     * Mud control
     */
    mudFrequency: 620,
    mudGain: -2.2,

    /*
     * Announcer / presence reduction
     */
    presenceFrequency: 3000,
    presenceGain: -4.8,

    /*
     * Brightness reduction
     */
    brightnessFrequency: 5600,
    brightnessGain: -4.5,

    /*
     * Harshness reduction
     */
    harshFrequency: 7200,
    harshGain: -3.5,

    /*
     * Saturation
     */
    saturationDrive: 2.8,

    /*
     * Main compression
     */
    compressorThreshold: -24,
    compressorKnee: 8,
    compressorRatio: 4.5,
    compressorAttack: 0.006,
    compressorRelease: 0.16,

    /*
     * Density compression
     */
    densityThreshold: -30,
    densityKnee: 5,
    densityRatio: 2.8,
    densityAttack: 0.012,
    densityRelease: 0.20,

    /*
     * Output
     */
    outputGain: 0.82
};


/* =========================================================
   Saturation
   ========================================================= */

function createVoiceSaturation(context) {

    const shaper =
        context.createWaveShaper();

    const samples = 4096;

    const curve =
        new Float32Array(samples);

    const drive =
        VOICE_PROCESSING.saturationDrive;

    for (
        let i = 0;
        i < samples;
        i++
    ) {

        const x =
            (i * 2) /
            (samples - 1) -
            1;

        /*
         * より強い非線形処理。
         * ただし完全な歪みにはしない。
         */

        curve[i] =
            Math.tanh(
                x * drive
            ) /
            Math.tanh(
                drive
            );
    }

    shaper.curve =
        curve;

    shaper.oversample =
        "4x";

    return shaper;
}


/* =========================================================
   EQ helper
   ========================================================= */

function createEQ(
    context,
    type,
    frequency,
    gain,
    Q
) {

    const filter =
        context.createBiquadFilter();

    filter.type =
        type;

    filter.frequency.value =
        frequency;

    filter.gain.value =
        gain;

    filter.Q.value =
        Q;

    return filter;
}


/* =========================================================
   強化版J.A.R.V.I.S.音声チェーン
   ========================================================= */

function createVoiceProcessingChain(context) {

    /*
     * -----------------------------------------
     * 1. High Pass
     * -----------------------------------------
     */

    const highpass =
        context.createBiquadFilter();

    highpass.type =
        "highpass";

    highpass.frequency.value =
        VOICE_PROCESSING.highpassFrequency;

    highpass.Q.value =
        0.65;


    /*
     * -----------------------------------------
     * 2. Low Body
     * -----------------------------------------
     */

    const lowBody =
        createEQ(
            context,
            "lowshelf",
            VOICE_PROCESSING.lowBodyFrequency,
            VOICE_PROCESSING.lowBodyGain,
            0.7
        );


    /*
     * -----------------------------------------
     * 3. Low-Mid Body
     * -----------------------------------------
     */

    const lowMid =
        createEQ(
            context,
            "peaking",
            VOICE_PROCESSING.lowMidFrequency,
            VOICE_PROCESSING.lowMidGain,
            0.9
        );


    /*
     * -----------------------------------------
     * 4. Mud reduction
     * -----------------------------------------
     */

    const mud =
        createEQ(
            context,
            "peaking",
            VOICE_PROCESSING.mudFrequency,
            VOICE_PROCESSING.mudGain,
            1.0
        );


    /*
     * -----------------------------------------
     * 5. Presence reduction
     *
     * アナウンサー的な
     * 「前に出てくる明瞭さ」を削る
     * -----------------------------------------
     */

    const presence =
        createEQ(
            context,
            "peaking",
            VOICE_PROCESSING.presenceFrequency,
            VOICE_PROCESSING.presenceGain,
            0.85
        );


    /*
     * -----------------------------------------
     * 6. Brightness reduction
     * -----------------------------------------
     */

    const brightness =
        createEQ(
            context,
            "peaking",
            VOICE_PROCESSING.brightnessFrequency,
            VOICE_PROCESSING.brightnessGain,
            0.75
        );


    /*
     * -----------------------------------------
     * 7. Harshness reduction
     * -----------------------------------------
     */

    const harshness =
        createEQ(
            context,
            "peaking",
            VOICE_PROCESSING.harshFrequency,
            VOICE_PROCESSING.harshGain,
            1.1
        );


    /*
     * -----------------------------------------
     * 8. Low Pass
     *
     * 高域の「放送・ナレーション感」を削る
     * -----------------------------------------
     */

    const lowpass =
        context.createBiquadFilter();

    lowpass.type =
        "lowpass";

    lowpass.frequency.value =
        VOICE_PROCESSING.lowpassFrequency;

    lowpass.Q.value =
        0.45;


    /*
     * -----------------------------------------
     * 9. Saturation
     * -----------------------------------------
     */

    const saturation =
        createVoiceSaturation(
            context
        );


    /*
     * -----------------------------------------
     * 10. Main compressor
     * -----------------------------------------
     */

    const compressor =
        context.createDynamicsCompressor();

    compressor.threshold.value =
        VOICE_PROCESSING.compressorThreshold;

    compressor.knee.value =
        VOICE_PROCESSING.compressorKnee;

    compressor.ratio.value =
        VOICE_PROCESSING.compressorRatio;

    compressor.attack.value =
        VOICE_PROCESSING.compressorAttack;

    compressor.release.value =
        VOICE_PROCESSING.compressorRelease;


    /*
     * -----------------------------------------
     * 11. Density compressor
     *
     * 声の密度をさらに均一化
     * -----------------------------------------
     */

    const density =
        context.createDynamicsCompressor();

    density.threshold.value =
        VOICE_PROCESSING.densityThreshold;

    density.knee.value =
        VOICE_PROCESSING.densityKnee;

    density.ratio.value =
        VOICE_PROCESSING.densityRatio;

    density.attack.value =
        VOICE_PROCESSING.densityAttack;

    density.release.value =
        VOICE_PROCESSING.densityRelease;


    /*
     * -----------------------------------------
     * 12. Final tone
     * -----------------------------------------
     */

    const finalTone =
        createEQ(
            context,
            "peaking",
            180,
            1.8,
            0.8
        );


    /*
     * -----------------------------------------
     * 13. Output
     * -----------------------------------------
     */

    const outputGain =
        context.createGain();

    outputGain.gain.value =
        VOICE_PROCESSING.outputGain;


    /*
     * -----------------------------------------
     * 接続
     * -----------------------------------------
     */

    highpass.connect(
        lowBody
    );

    lowBody.connect(
        lowMid
    );

    lowMid.connect(
        mud
    );

    mud.connect(
        presence
    );

    presence.connect(
        brightness
    );

    brightness.connect(
        harshness
    );

    harshness.connect(
        lowpass
    );

    lowpass.connect(
        saturation
    );

    saturation.connect(
        compressor
    );

    compressor.connect(
        density
    );

    density.connect(
        finalTone
    );

    finalTone.connect(
        outputGain
    );

    outputGain.connect(
        context.destination
    );


    return {
        input: highpass,
        output: outputGain
    };
}


/* =========================================================
   Error
   ========================================================= */

function getErrorMessage(error) {

    if (typeof error === "string") {
        return error;
    }

    if (
        error &&
        typeof error === "object"
    ) {

        if (error.message) {
            return error.message;
        }

        try {
            return JSON.stringify(error);
        } catch (e) {
            return "不明なエラー";
        }
    }

    return String(error);
}


/* =========================================================
   Mode
   ========================================================= */

function setMode(mode) {

    if (
        mode !== "voice" &&
        mode !== "text" &&
        mode !== "auto"
    ) {
        return;
    }

    currentMode =
        mode;


    modeButtons.forEach(
        (modeButton) => {

            modeButton.classList.toggle(
                "active",
                modeButton.dataset.mode === mode
            );

        }
    );


    if (mode === "text") {

        textArea.style.display =
            "block";

        button.style.display =
            "none";


        if (conversationActive) {

            if (recognitionRunning) {

                try {
                    recognition.stop();
                } catch (e) {}

            }

            recognitionRunning =
                false;
        }


        status.textContent =
            "文字入力モード";

    } else {

        textArea.style.display =
            "none";

        button.style.display =
            "inline-block";


        if (mode === "voice") {

            button.textContent =
                conversationActive
                    ? "⏹️ 終了"
                    : "🎙️ 話す";


            if (conversationActive) {

                status.textContent =
                    "音声入力モード";
            }

        } else {

            button.textContent =
                conversationActive
                    ? "⏹️ 終了"
                    : "⚡ AUTO";


            if (conversationActive) {

                status.textContent =
                    "自動モード";
            }
        }
    }
}


/* =========================================================
   Memory
   ========================================================= */

async function loadMemories() {

    try {

        const response =
            await fetch(
                "/api/memory",
                {
                    method: "GET"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.ok
        ) {

            throw new Error(
                getErrorMessage(
                    data.error
                ) ||
                "Memory GET error"
            );

        }


        memories =
            Array.isArray(
                data.memories
            )
                ? data.memories.slice(0, 30)
                : [];


        return memories;

    } catch (error) {

        console.error(
            "Memory load error:",
            error
        );

        memories =
            [];

        return [];
    }
}


/* =========================================================
   Memory Context
   ========================================================= */

function buildMemoryContext() {

    if (!memories.length) {

        return "現在、登録されている長期記憶はありません。";
    }


    return memories
        .map(
            (memory, index) => {

                return (
                    `${index + 1}. ` +
                    `[${memory.category}] ` +
                    `${memory.content}`
                );

            }
        )
        .join("\n");
}


/* =========================================================
   Gemini Prompt
   ========================================================= */

function buildGeminiPrompt(text) {

    const memoryContext =
        buildMemoryContext();


    return `
あなたは真人さん専用のAIアシスタント、J.A.R.V.I.S.です。

以下は真人さんについて保存されている長期記憶です。
今回の会話に関連する場合のみ自然に利用してください。
記憶にないことは推測しないでください。

--- 長期記憶 ---
${memoryContext}
--- 長期記憶ここまで ---

今回の真人さんの発言：
${text}

以下のルールで判断してください。

1. 真人さんの発言への自然な回答を「reply」に入れてください。
2. 今後の会話でも長期的に役立つ情報なら「memory.shouldSave」をtrueにしてください。
3. 一時的な発言、雑談、その場限りの情報は保存しないでください。
4. 「覚えて」「記憶して」など明示的に保存を求められた場合は、保存対象として扱ってください。
5. 保存する場合は、発言そのものではなく、今後利用しやすい簡潔な事実として「memory.content」にしてください。
6. カテゴリは以下から選択してください。
   - personal
   - preference
   - work
   - family
   - goal
7. 重要度は1〜5で設定してください。
8. 保存しない場合は「memory.shouldSave」をfalseにしてください。
9. 保存しない場合でも「reply」は通常どおり自然に回答してください。
`;
}


/* =========================================================
   Save Memory
   ========================================================= */

async function saveMemory(memory) {

    if (
        !memory ||
        !memory.shouldSave
    ) {
        return false;
    }


    const content =
        typeof memory.content === "string"
            ? memory.content.trim()
            : "";


    if (!content) {
        return false;
    }


    const category =
        [
            "personal",
            "preference",
            "work",
            "family",
            "goal"
        ].includes(
            memory.category
        )
            ? memory.category
            : "personal";


    const importance =
        Number.isInteger(
            memory.importance
        )
            ? Math.min(
                5,
                Math.max(
                    1,
                    memory.importance
                )
            )
            : 1;


    try {

        const response =
            await fetch(
                "/api/memory",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        category,
                        content,
                        importance
                    })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.ok
        ) {

            throw new Error(
                getErrorMessage(
                    data.error
                ) ||
                "Memory save error"
            );
        }


        await loadMemories();

        return true;

    } catch (error) {

        console.error(
            "Memory save error:",
            error
        );

        return false;
    }
}


/* =========================================================
   PCM → WAV
   ========================================================= */

function pcmToWav(base64) {

    const binary =
        atob(base64);


    const pcm =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        pcm[i] =
            binary.charCodeAt(i);
    }


    const sampleRate =
        24000;

    const channels =
        1;

    const bitsPerSample =
        16;


    const byteRate =
        sampleRate *
        channels *
        bitsPerSample /
        8;


    const blockAlign =
        channels *
        bitsPerSample /
        8;


    const buffer =
        new ArrayBuffer(
            44 +
            pcm.length
        );


    const view =
        new DataView(
            buffer
        );


    function writeString(
        offset,
        string
    ) {

        for (
            let i = 0;
            i < string.length;
            i++
        ) {

            view.setUint8(
                offset + i,
                string.charCodeAt(i)
            );
        }
    }


    writeString(
        0,
        "RIFF"
    );


    view.setUint32(
        4,
        36 + pcm.length,
        true
    );


    writeString(
        8,
        "WAVE"
    );


    writeString(
        12,
        "fmt "
    );


    view.setUint32(
        16,
        16,
        true
    );


    view.setUint16(
        20,
        1,
        true
    );


    view.setUint16(
        22,
        channels,
        true
    );


    view.setUint32(
        24,
        sampleRate,
        true
    );


    view.setUint32(
        28,
        byteRate,
        true
    );


    view.setUint16(
        32,
        blockAlign,
        true
    );


    view.setUint16(
        34,
        bitsPerSample,
        true
    );


    writeString(
        36,
        "data"
    );


    view.setUint32(
        40,
        pcm.length,
        true
    );


    new Uint8Array(
        buffer,
        44
    ).set(pcm);


    return new Blob(
        [buffer],
        {
            type:
                "audio/wav"
        }
    );
}


/* =========================================================
   Listening
   ========================================================= */

function startListening() {

    if (!conversationActive) {
        return;
    }


    if (currentMode === "text") {
        return;
    }


    if (recognitionRunning) {
        return;
    }


    if (!recognition) {

        if (
            currentMode === "auto"
        ) {

            textArea.style.display =
                "block";

            button.style.display =
                "none";

            status.textContent =
                "音声認識が使えないため文字入力に切り替えました";

            return;
        }


        status.textContent =
            "音声認識を初期化できません";

        return;
    }


    try {

        status.textContent =
            "聞いています…";


        recognitionRunning =
            true;


        recognition.start();

    } catch (error) {

        recognitionRunning =
            false;


        status.textContent =
            "音声認識開始エラー：" +
            getErrorMessage(
                error
            );
    }
}


/* =========================================================
   Gemini TTS
   ========================================================= */

async function speakWithGemini(text) {

    status.textContent =
        "J.A.R.V.I.S. 音声生成中…";


    diagnostic.style.display =
        "none";


    diagnostic.textContent =
        "";


    const controller =
        new AbortController();


    const timeout =
        setTimeout(
            () => {
                controller.abort();
            },
            240000
        );


    try {

        const response =
            await fetch(
                "/api/tts",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        text
                    }),

                    signal:
                        controller.signal
                }
            );


        clearTimeout(timeout);


        const data =
            await response.json();


        if (
            data.diagnostic === true
        ) {

            status.textContent =
                "TTS診断完了";


            diagnostic.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );


            diagnostic.style.display =
                "block";


            return false;
        }


        if (!response.ok) {

            throw new Error(
                getErrorMessage(
                    data.error
                ) ||
                "TTS HTTP " +
                response.status
            );
        }


        if (!data.audio) {

            throw new Error(
                "音声データがありません"
            );
        }


        const wav =
            pcmToWav(
                data.audio
            );


        const arrayBuffer =
            await wav.arrayBuffer();


        const audioBuffer =
            await audioContext.decodeAudioData(
                arrayBuffer
            );


        if (currentSource) {

            try {
                currentSource.stop();
            } catch (e) {}

            currentSource =
                null;
        }


        /*
         * =================================================
         * FINAL J.A.R.V.I.S. VOICE ENGINE
         * =================================================
         */

        const processing =
            createVoiceProcessingChain(
                audioContext
            );


        currentSource =
            audioContext.createBufferSource();


        currentSource.buffer =
            audioBuffer;


        /*
         * Charonを直接再生しない。
         *
         * 必ず全音声処理を通過させる。
         */

        currentSource.connect(
            processing.input
        );


        await new Promise(
            resolve => {

                currentSource.onended =
                    () => {

                        currentSource =
                            null;

                        resolve();
                    };


                status.textContent =
                    "J.A.R.V.I.S. 発話中…";


                currentSource.start();
            }
        );


        return true;

    } catch (error) {

        clearTimeout(timeout);


        console.error(
            "TTS error:",
            error
        );


        return false;
    }
}


/* =========================================================
   Gemini
   ========================================================= */

async function sendToGemini(text) {

    const cleanText =
        typeof text === "string"
            ? text.trim()
            : "";


    if (!cleanText) {
        return;
    }


    if (!conversationActive) {
        return;
    }


    status.textContent =
        "Geminiへ送信中…";


    try {

        const controller =
            new AbortController();


        const timeout =
            setTimeout(
                () => {
                    controller.abort();
                },
                240000
            );


        const response =
            await fetch(
                "/api/gemini",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        text:
                            buildGeminiPrompt(
                                cleanText
                            ),

                        previousInteractionId:
                            previousInteractionId
                    }),

                    signal:
                        controller.signal
                }
            );


        clearTimeout(timeout);


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                getErrorMessage(
                    data.error
                ) ||
                "Gemini HTTP " +
                response.status
            );
        }


        if (!data.text) {

            throw new Error(
                "Geminiから回答テキストがありません"
            );
        }


        if (data.interactionId) {

            previousInteractionId =
                data.interactionId;
        }


        if (
            data.memory &&
            data.memory.shouldSave === true
        ) {

            status.textContent =
                "記憶しています…";


            const saved =
                await saveMemory(
                    data.memory
                );


            if (saved) {

                status.textContent =
                    "記憶しました";

            } else {

                status.textContent =
                    "記憶の保存に失敗しました";
            }


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        500
                    )
            );
        }


        responseArea.textContent =
            data.text;


        if (
            currentMode === "text"
        ) {

            status.textContent =
                "回答完了";

            return;
        }


        status.textContent =
            "J.A.R.V.I.S. 音声生成中…";


        const spoken =
            await speakWithGemini(
                data.text
            );


        if (!spoken) {

            status.textContent =
                "音声生成に失敗しました。回答は画面に表示しています。";

            return;
        }


        if (conversationActive) {

            status.textContent =
                "次の入力を待っています…";


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        150
                    )
            );


            if (conversationActive) {

                startListening();
            }
        }

    } catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            status.textContent =
                "エラー：Geminiへの接続がタイムアウトしました";

        } else {

            status.textContent =
                "エラー：" +
                getErrorMessage(
                    error
                );
        }
    }
}


/* =========================================================
   Speech Recognition
   ========================================================= */

if (!SpeechRecognition) {

    if (
        currentMode === "voice"
    ) {

        status.textContent =
            "音声認識に対応していません";
    }

} else {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "ja-JP";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onresult =
        async (event) => {

            recognitionRunning =
                false;


            const text =
                event.results[0][0]
                    .transcript;


            status.textContent =
                "認識：「" +
                text +
                "」";


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        300
                    )
            );


            if (!conversationActive) {
                return;
            }


            await sendToGemini(
                text
            );
        };


    recognition.onerror =
        (event) => {

            recognitionRunning =
                false;


            if (
                currentMode ===
                "auto"
            ) {

                textArea.style.display =
                    "block";

                button.style.display =
                    "none";

                status.textContent =
                    "音声入力を使用できないため、文字入力に切り替えました";

                return;
            }


            status.textContent =
                "音声認識エラー：" +
                event.error;


            if (
                conversationActive &&
                event.error !==
                    "not-allowed" &&
                event.error !==
                    "service-not-allowed"
            ) {

                setTimeout(
                    () => {

                        startListening();

                    },
                    500
                );
            }
        };


    recognition.onend =
        () => {

            recognitionRunning =
                false;
        };
}


/* =========================================================
   Conversation
   ========================================================= */

button.addEventListener(
    "click",
    async () => {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }


        await audioContext.resume();


        if (conversationActive) {

            conversationActive =
                false;


            if (recognitionRunning) {

                try {
                    recognition.stop();
                } catch (e) {}
            }


            recognitionRunning =
                false;


            if (currentSource) {

                try {
                    currentSource.stop();
                } catch (e) {}

                currentSource =
                    null;
            }


            previousInteractionId =
                null;


            status.textContent =
                "待機中";


            button.textContent =
                currentMode === "auto"
                    ? "⚡ AUTO"
                    : "🎙️ 話す";


            return;
        }


        status.textContent =
            "記憶を読み込んでいます…";


        await loadMemories();


        previousInteractionId =
            null;


        conversationActive =
            true;


        button.textContent =
            "⏹️ 終了";


        startListening();
    }
);


/* =========================================================
   Text
   ========================================================= */

sendButton.addEventListener(
    "click",
    async () => {

        const text =
            textInput.value.trim();


        if (!text) {
            return;
        }


        if (!conversationActive) {

            await loadMemories();

            previousInteractionId =
                null;

            conversationActive =
                true;
        }


        textInput.value =
            "";


        await sendToGemini(
            text
        );
    }
);


/* =========================================================
   Enter
   ========================================================= */

textInput.addEventListener(
    "keydown",
    async (event) => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendButton.click();
        }
    }
);


/* =========================================================
   Mode Buttons
   ========================================================= */

modeButtons.forEach(
    (modeButton) => {

        modeButton.addEventListener(
            "click",
            () => {

                setMode(
                    modeButton.dataset.mode
                );
            }
        );
    }
);


/* =========================================================
   Initial
   ========================================================= */

setMode(
    "voice"
);

loadMemories();

</script>
