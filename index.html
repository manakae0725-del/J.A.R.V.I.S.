<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>J.A.R.V.I.S. 3D CORE</title>
<script src="https://tailwindcss.com"></script>
<style>
/* 無限の奥行きを感じさせるディープブラック背景 */
body {
    margin: 0;
    background: radial-gradient(circle at center, #000814 0%, #000000 100%);
    overflow: hidden;
    height: 100vh;
    perspective: 1000px; /* 画面全体に3Dの遠近感を付与 */
}

/* 圧倒的なクリアブルーの発光効果 */
.laser-glow {
    filter: drop-shadow(0 0 4px #00b9ff) drop-shadow(0 0 15px rgba(0, 136, 255, 0.6));
}
.core-text-glow {
    fill: #ffffff;
    font-family: 'Arial Black', sans-serif;
    font-weight: 900;
    letter-spacing: 4px;
    text-shadow: 0 0 5px #fff, 0 0 12px #00d2ff, 0 0 25px #0044ff;
}

/* =========================================================
   BACKGROUND PARTICLES (奥から手前に流れる光の粒子)
   ========================================================= */
.space {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}
.particle {
    position: absolute;
    background: #00f0ff;
    border-radius: 50%;
    opacity: 0;
    box-shadow: 0 0 8px #00b9ff;
    animation: fly-forward 6s linear infinite;
}
/* それぞれの粒子の配置とスピードをバラバラにして立体感を出す */
.p1 { left: 20%; top: 30%; width: 2px; height: 2px; animation-delay: 0s; }
.p2 { left: 75%; top: 15%; width: 3px; height: 3px; animation-delay: 1.5s; animation-duration: 4s; }
.p3 { left: 40%; top: 80%; width: 1.5px; height: 1.5px; animation-delay: 3s; animation-duration: 8s; }
.p4 { left: 85%; top: 70%; width: 2.5px; height: 2.5px; animation-delay: 4.5s; animation-duration: 5s; }
.p5 { left: 10%; top: 65%; width: 2px; height: 2px; animation-delay: 2s; animation-duration: 7s; }

@keyframes fly-forward {
    0% { transform: translateZ(-500px) scale(0); opacity: 0; }
    20% { opacity: 0.4; }
    80% { opacity: 0.8; }
    100% { transform: translateZ(300px) scale(2); opacity: 0; }
}

/* =========================================================
   3D HOROGRAM RE-ACTOR (斜め立体回転＆ジャイロ構造)
   ========================================================= */
.hologram-container {
    position: relative;
    width: 320px;
    height: 320px;
    z-index: 10;
    transform-style: preserve-3d;
}

/* ボスが教えてくれた「斜めにゆっくり回転する2本のリング」 */
.gyro-ring-1 {
    position: absolute;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform: rotateX(65deg) rotateY(20deg); /* 傾いた軌道 */
    animation: spin-gyro-1 25s linear infinite;
}
.gyro-ring-2 {
    position: absolute;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform: rotateX(-45deg) rotateY(-35deg); /* 交差する逆傾き軌道 */
    animation: spin-gyro-2 18s linear infinite;
}

/* 中心に鎮座する、手前に飛び出して見える立体コア */
.center-core-box {
    position: absolute;
    width: 100%;
    height: 100%;
    transform: translateZ(40px); /* 40ピクセル分、完全に手前に浮かび上がらせる */
    display: flex;
    align-items: center;
    justify-content: center;
}

@keyframes spin-gyro-1 {
    from { transform: rotateX(65deg) rotateY(20deg) rotateZ(0deg); }
    to { transform: rotateX(65deg) rotateY(20deg) rotateZ(360deg); }
}
@keyframes spin-gyro-2 {
    from { transform: rotateX(-45deg) rotateY(-35deg) rotateZ(360deg); }
    to { transform: rotateX(-45deg) rotateY(-35deg) rotateZ(0deg); }
}

/* 音声入力時の強烈なレッドアラートモード（100%自動で切り替わります） */
.listening-state .laser-glow {
    filter: drop-shadow(0 0 4px #ff0055) drop-shadow(0 0 18px rgba(255, 0, 0, 0.7));
}
.listening-state .core-text-glow {
    fill: #ffcbdc;
    text-shadow: 0 0 5px #fff, 0 0 12px #ff0055, 0 0 30px #ff0000;
}
.listening-state .color-bind { stroke: #ff0055 !important; }
.listening-state .particle { background: #ff0055 !important; box-shadow: 0 0 8px #ff0000; }
</style>
</head>
<body class="flex items-center justify-center select-none">

    <!-- 背景層：漂う光の粒子 -->
    <div class="space">
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
    </div>

    <!-- メイン：文字を一切排除した、3Dホログラム・アークリアクター -->
    <div id="jarvisCore" class="hologram-container cursor-pointer active:scale-95 transition-transform duration-200">
        
        <!-- 【再現1】斜め立体回転リング 1本目 -->
        <div class="gyro-ring-1">
            <svg viewBox="0 0 600 600" class="w-full h-full overflow-visible laser-glow">
                <circle class="color-bind" cx="300" cy="300" r="240" fill="none" stroke="#00b9ff" stroke-width="2.5" stroke-dasharray="160 40 40 40 80 20" />
                <circle cx="300" cy="300" r="225" fill="none" stroke="rgba(0,185,255,0.3)" stroke-width="1" stroke-dasharray="4 8" />
            </svg>
        </div>

        <!-- 【再現2】斜め立体回転リング 2本目（交差して逆回転） -->
        <div class="gyro-ring-2">
            <svg viewBox="0 0 600 600" class="w-full h-full overflow-visible laser-glow">
                <circle class="color-bind" cx="300" cy="300" r="210" fill="none" stroke="#0055ff" stroke-width="2" stroke-dasharray="200 60 10 30" />
                <circle class="color-bind" cx="300" cy="300" r="195" fill="none" stroke="#00b9ff" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.6" />
            </svg>
        </div>

        <!-- 【再現3】一番下にどっしりと構える、固定された重厚な「台座（ベース）リング」 -->
        <div class="absolute inset-0 transform rotateX(80deg) translateZ(-60px)">
            <svg viewBox="0 0 600 600" class="w-full h-full overflow-visible laser-glow" opacity="0.5">
                <!-- 地面に水平に広がる太いベース台座 -->
                <circle class="color-bind" cx="300" cy="300" r="270" fill="none" stroke="#0033aa" stroke-width="6" stroke-dasharray="30 10 10 10" />
                <circle cx="300" cy="300" r="285" fill="none" stroke="#00b9ff" stroke-width="1" stroke-dasharray="4 4" />
            </svg>
        </div>

        <!-- 【再現4】最も手前に浮かび上がる「中心の小さいコア」＆「JARVIS」ロゴ -->
        <div class="center-core-box">
            <svg viewBox="0 0 200 200" class="w-[120px] h-[120px] overflow-visible laser-glow">
                <!-- 小さい中心コアサークル -->
                <circle class="color-bind" cx="100" cy="100" r="75" fill="#000000" stroke="#00b9ff" stroke-width="3" />
                <circle cx="100" cy="100" r="65" fill="none" stroke="#0044ff" stroke-width="1.5" stroke-dasharray="4 8" />
                <circle cx="100" cy="100" r="55" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1" stroke-dasharray="40 10" />
                <!-- コアの中の中心文字「JARVIS」 -->
                <text class="core-text-glow" x="100" y="106" text-anchor="middle" font-size="16">JARVIS</text>
            </svg>
        </div>

    </div>

    <!-- ※裏で動く音声連動スクリプト（画面上には一切表示されません） -->
    <script>
        const jarvisCore = document.getElementById('jarvisCore');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = false;
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'ja-JP';
            uttr.pitch = 0.86;
            uttr.rate = 1.05;
            window.speechSynthesis.speak(uttr);
        }

        if (recognition) {
            // 文字やボタンが無くても、この美しいアークリアクターをタップすれば100%マイクが起動します
            jarvisCore.addEventListener('click', () => {
                window.speechSynthesis.cancel();
                try { recognition.start(); } catch(e) {}
            });

            recognition.onstart = () => {
                document.body.classList.add('listening-state');
            };

            recognition.onend = () => {
                document.body.classList.remove('listening-state');
            };

            recognition.onresult = async (event) => {
                const userText = event.results.transcript;
                const key = localStorage.getItem('gemini_key') || ""; // 事前に格納されたキーを使用

                if (!key) {
                    speak("APIキーが未設定です、ボス。");
                    return;
                }

                try {
                    const res = await fetch(`https://googleapis.com{key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `あなたは映画アイアンマンのAIアシスタント「JARVIS」です。主人である「ボス」に忠実に、最高に知的で簡潔な大人のセリフ（1〜2文）で答えてください。語尾は必ず「〜です、ボス」「〜でしょうか、ボス」にしてください。質問：${userText}` }] }]
                        })
                    });
                    const data = await res.json();
                    if(!data.error) {
                        const aiText = data.candidates.content.parts.text;
                        speak(aiText);
                    } else {
                        speak("通信エラーのようです、ボス。");
                    }
                } catch (err) {
                    speak("サーバーへの接続に失敗しました、ボス。");
                }
            };
        }
    </script>
</body>
</html>
