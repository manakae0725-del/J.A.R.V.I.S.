<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS - Core UI Component</title>
    <style>
        /* ==========================================
           1. リセット & ベーススタイル
           ========================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #020408;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            color: #00d9ff;
            -webkit-font-smoothing: antialiased;
        }

        /* ==========================================
           2. レイアウト構造（レスポンシブ設計）
           iPhone: 画面いっぱいにCoreを表示
           PC / 大画面: 左右パネル拡張用スペースを確保した中央配置
           ========================================== */
        .jarvis-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #061528 0%, #020408 70%, #000000 100%);
        }

        /* 背景の深度レイヤー（微小な星・ノイズ効果） */
        .jarvis-bg-dust {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* ==========================================
           3. Core（中央の光るサークル・ホログラム構造）
           ========================================== */
        .jarvis-core-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            /* 画面サイズに応じたレスポンシブスケール (CSS変数で制御) */
            transform: scale(var(--core-scale, 1));
            transition: transform 0.3s ease-out;
            filter: drop-shadow(0 0 25px rgba(0, 217, 255, 0.4));
        }

        @media (min-width: 768px) {
            .jarvis-core-wrapper { width: 420px; height: 420px; }
        }
        @media (min-width: 1200px) {
            .jarvis-core-wrapper { width: 500px; height: 500px; }
        }

        /* 上部・下部のフローティング・ホログラムリング（添付画像の上下の円盤に対応） */
        .hologram-ring-top, .hologram-ring-bottom {
            position: absolute;
            width: 80%;
            height: 60px;
            border: 1px dashed rgba(0, 217, 255, 0.4);
            border-radius: 50%;
            left: 10%;
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.2), inset 0 0 15px rgba(0, 217, 255, 0.2);
            transform: rotateX(75deg);
        }
        .hologram-ring-top {
            top: -70px;
            animation: rotateClockwise 12s linear infinite;
        }
        .hologram-ring-bottom {
            bottom: -70px;
            animation: rotateCounterClockwise 15s linear infinite;
        }

        /* 中央をつなぐ縦方向のエネルギー柱・光のライン */
        .vertical-energy-beam {
            position: absolute;
            width: 4px;
            height: 140%;
            background: linear-gradient(to bottom, transparent, rgba(0, 217, 255, 0.8), #ffffff, rgba(0, 217, 255, 0.8), transparent);
            box-shadow: 0 0 20px #00d9ff, 0 0 40px #00d9ff;
            pointer-events: none;
            z-index: 3;
        }

        /* 多重円形HUDレイヤー群 */
        .hud-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid transparent;
            pointer-events: none;
        }

        /* 外周リング 1 (スキャン・回転) */
        .ring-outer-1 {
            width: 100%;
            height: 100%;
            border-color: rgba(0, 162, 255, 0.25);
            border-top: 2px solid rgba(0, 217, 255, 0.9);
            border-bottom: 2px solid rgba(0, 217, 255, 0.9);
            animation: rotateClockwise 20s linear infinite;
        }

        /* 外周セグメントリング 2 */
        .ring-outer-2 {
            width: 88%;
            height: 88%;
            border: 2px dashed rgba(0, 217, 255, 0.35);
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.15) inset;
            animation: rotateCounterClockwise 25s linear infinite;
        }

        /* 中間アーキテクチャリング 3 (テックパターン) */
        .ring-middle-1 {
            width: 75%;
            height: 75%;
            border: 2px solid rgba(0, 217, 255, 0.5);
            border-left: 3px solid transparent;
            border-right: 3px solid transparent;
            animation: rotateClockwise 10s linear infinite;
        }

        .ring-middle-2 {
            width: 64%;
            height: 64%;
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-top: 3px solid #00d9ff;
            animation: rotateCounterClockwise 8s linear infinite;
        }

        /* コア中心部（最も眩しく光るサークル） */
        .core-center-sphere {
            position: absolute;
            width: 42%;
            height: 42%;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #00d9ff 40%, #0044aa 80%, #010a1a 100%);
            box-shadow: 0 0 35px #00d9ff, 0 0 70px rgba(0, 217, 255, 0.8), inset 0 0 20px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: corePulse 4s ease-in-out infinite;
        }

        /* JARVIS テキストロゴ発光 */
        .jarvis-logo-text {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 0.35em;
            color: #ffffff;
            text-shadow: 0 0 8px #00d9ff, 0 0 15px #00d9ff, 0 0 25px #00d9ff;
            z-index: 5;
            animation: textFlicker 6s infinite;
        }
        @media (min-width: 768px) {
            .jarvis-logo-text { font-size: 1.4rem; }
        }

        /* ==========================================
           4. アニメーション定義
           ========================================== */
        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounterClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        @keyframes corePulse {
            0%, 100% {
                transform: scale(0.97);
                box-shadow: 0 0 30px #00d9ff, 0 0 60px rgba(0, 217, 255, 0.6), inset 0 0 15px #ffffff;
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 0 45px #00d9ff, 0 0 90px rgba(0, 217, 255, 0.9), inset 0 0 30px #ffffff;
            }
        }

        @keyframes textFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
                text-shadow: 0 0 8px #00d9ff, 0 0 15px #00d9ff, 0 0 25px #00d9ff;
            }
            20%, 24%, 55% {
                opacity: 0.7;
                text-shadow: 0 0 2px #00d9ff;
            }
        }

        /* ==========================================
           5. 将来の拡張用コンテナ（左右パネル等配置用）
           ※現在は非表示、PC表示時にグリッド展開可能
           ========================================== */
        .side-panel-left, .side-panel-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 250px;
            height: 70vh;
            pointer-events: none;
            display: none; /* 初期状態では非表示（UI条件1を厳守） */
            z-index: 10;
        }
        .side-panel-left { left: 30px; }
        .side-panel-right { right: 30px; }

        @media (min-width: 1200px) {
            /* PC大画面では将来拡張用エリアの土台を確保 */
            .side-panel-left, .side-panel-right {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div class="jarvis-container" id="jarvisContainer">
        <!-- 背景パーティクルCanvas -->
        <canvas class="jarvis-bg-dust" id="dustCanvas"></canvas>

        <!-- 将来の拡張パネル（売上・タスク・通知等）予約エリア -->
        <div class="side-panel-left"></div>

        <!-- JARVIS Core（顔）コンポーネント本体 -->
        <div class="jarvis-core-wrapper" id="coreWrapper">
            <!-- 上下ホログラムディスク -->
            <div class="hologram-ring-top"></div>
            <div class="hologram-ring-bottom"></div>

            <!-- 縦方向エネルギー柱 -->
            <div class="vertical-energy-beam"></div>

            <!-- 多重回転HUDリング -->
            <div class="hud-ring ring-outer-1"></div>
            <div class="hud-ring ring-outer-2"></div>
            <div class="hud-ring ring-middle-1"></div>
            <div class="hud-ring ring-middle-2"></div>

            <!-- 中央発光コアスフィア ＆ ロゴ -->
            <div class="core-center-sphere">
                <div class="jarvis-logo-text">JARVIS</div>
            </div>
        </div>

        <!-- 将来の拡張パネル右 -->
        <div class="side-panel-right"></div>
    </div>

    <script>
        /* ==========================================
           JavaScript: 動的背景パーティクル ＆ スケール制御
           ========================================== */
        document.addEventListener('DOMContentLoaded', () => {
            // 1. 背景の浮遊ダスト（ホログラムの微粒子）エフェクト
            const canvas = document.getElementById('dustCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const particles = [];
            const particleCount = 45;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5 + 0.5,
                    color: Math.random() > 0.3 ? 'rgba(0, 217, 255, ' : 'rgba(255, 255, 255, ',
                    alpha: Math.random() * 0.7 + 0.2,
                    speedY: (Math.random() * 0.4 - 0.2),
                    speedX: (Math.random() * 0.2 - 0.1)
                });
            }

            function animateDust() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    p.y += p.speedY;
                    p.x += p.speedX;

                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color + p.alpha + ')';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#00d9ff';
                    ctx.fill();
                });

                requestAnimationFrame(animateDust);
            }
            animateDust();

            // 2. レスポンシブ・スケール調整（画面サイズに応じた自動スケーリング）
            function updateCoreScale() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                const coreWrapper = document.getElementById('coreWrapper');

                let scale = 1;
                if (width < 400) {
                    scale = 0.82;
                } else if (width >= 1200) {
                    scale = 1.25; // 27インチなどの大画面向けに少し拡大
                } else {
                    scale = 1.0;
                }
                coreWrapper.style.setProperty('--core-scale', scale);
            }

            window.addEventListener('resize', updateCoreScale);
            updateCoreScale();
        });
    </script>
</body>
</html>
