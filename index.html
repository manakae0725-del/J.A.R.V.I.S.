<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>

<style>
body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 80px;
    font-size: 32px;
    letter-spacing: 6px;
}

button {
    margin-top: 100px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 2px solid #555;
    background: #111;
    color: white;
    font-size: 20px;
}

button:active {
    background: #333;
}

#status {
    margin-top: 30px;
    color: #aaa;
    padding: 0 20px;
    word-break: break-word;
}

#diagnostic {
    display: none;
    margin: 30px 20px;
    padding: 15px;
    background: #111;
    border: 1px solid #444;
    border-radius: 10px;
    color: #ddd;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.5;
    max-height: 500px;
    overflow-y: auto;
}
</style>
</head>

<body>

<h1>J.A.R.V.I.S.</h1>

<button id="talkButton">🎙️ 話す</button>

<div id="status">待機中</div>

<pre id="diagnostic"></pre>

<script>

const button = document.getElementById("talkButton");
const status = document.getElementById("status");
const diagnostic = document.getElementById("diagnostic");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let audioContext = null;
let currentSource = null;

let conversationActive = false;
let recognitionRunning = false;
let recognition = null;


/* ================================
   エラーを安全に文字列化
   ================================ */

function getErrorMessage(error) {

    if (typeof error === "string") {
        return error;
    }

    if (error && typeof error === "object") {

        if (error.message) {
            return error.message;
        }

        try {
            return JSON.stringify(error);
        } catch (e) {
            return "不明なエラー";
        }
    }

    return String(error);
}


/* ================================
   Gemini TTSのPCM音声をWAVに変換
   ================================ */

function pcmToWav(base64) {

    const binary = atob(base64);

    const pcm = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        pcm[i] = binary.charCodeAt(i);
    }

    const sampleRate = 24000;
    const channels = 1;
    const bitsPerSample = 16;

    const byteRate =
        sampleRate *
        channels *
        bitsPerSample / 8;

    const blockAlign =
        channels *
        bitsPerSample / 8;

    const buffer =
        new ArrayBuffer(44 + pcm.length);

    const view =
        new DataView(buffer);

    function writeString(offset, string) {

        for (let i = 0; i < string.length; i++) {

            view.setUint8(
                offset + i,
                string.charCodeAt(i)
            );

        }
    }

    writeString(0, "RIFF");

    view.setUint32(
        4,
        36 + pcm.length,
        true
    );

    writeString(8, "WAVE");
    writeString(12, "fmt ");

    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, channels, true);

    view.setUint32(
        24,
        sampleRate,
        true
    );

    view.setUint32(
        28,
        byteRate,
        true
    );

    view.setUint16(
        32,
        blockAlign,
        true
    );

    view.setUint16(
        34,
        bitsPerSample,
        true
    );

    writeString(36, "data");

    view.setUint32(
        40,
        pcm.length,
        true
    );

    new Uint8Array(buffer, 44).set(pcm);

    return new Blob(
        [buffer],
        { type: "audio/wav" }
    );
}


/* ================================
   音声認識開始
   ================================ */

function startListening() {

    if (!conversationActive) {
        return;
    }

    if (recognitionRunning) {
        return;
    }

    if (!recognition) {

        status.textContent =
            "音声認識を初期化できません";

        return;
    }

    try {

        status.textContent =
            "聞いています…";

        recognitionRunning = true;

        recognition.start();

    } catch (error) {

        recognitionRunning = false;

        status.textContent =
            "音声認識開始エラー：" +
            getErrorMessage(error);
    }
}


/* ================================
   Gemini TTS
   ================================ */

async function speakWithGemini(text) {

    status.textContent =
        "J.A.R.V.I.S. 音声生成中…";

    diagnostic.style.display = "none";
    diagnostic.textContent = "";

    const controller =
        new AbortController();

    const timeout =
        setTimeout(() => {

            controller.abort();

        }, 240000);

    try {

        const response =
            await fetch("/api/tts", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    text: text
                }),

                signal: controller.signal

            });

        clearTimeout(timeout);

        const data =
            await response.json();


        /* 診断レスポンス */

        if (data.diagnostic === true) {

            status.textContent =
                "TTS診断完了";

            diagnostic.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );

            diagnostic.style.display =
                "block";

            return;
        }


        /* TTSエラー */

        if (!response.ok) {

            throw new Error(
                getErrorMessage(data.error) ||
                "TTS HTTP " + response.status
            );
        }


        if (!data.audio) {

            throw new Error(
                "音声データがありません"
            );
        }


        /* PCM → WAV */

        const wav =
            pcmToWav(data.audio);

        const arrayBuffer =
            await wav.arrayBuffer();

        const audioBuffer =
            await audioContext.decodeAudioData(
                arrayBuffer
            );


        /* 現在の音声を停止 */

        if (currentSource) {

            try {
                currentSource.stop();
            } catch (e) {}

            currentSource = null;
        }


        /* AudioBufferSource */

        currentSource =
            audioContext.createBufferSource();

        currentSource.buffer =
            audioBuffer;

        currentSource.connect(
            audioContext.destination
        );


        /* 発話終了を待つ */

        await new Promise(resolve => {

            currentSource.onended = () => {

                currentSource = null;

                resolve();

            };

            status.textContent =
                "J.A.R.V.I.S. 発話中…";

            currentSource.start();

        });


        /* ================================
           発話終了 → 再び聞く
           ================================ */

        if (conversationActive) {

            status.textContent =
                "次の入力を待っています…";

            await new Promise(
                resolve =>
                    setTimeout(resolve, 300)
            );

            startListening();
        }

    } catch (error) {

        clearTimeout(timeout);

        if (error.name === "AbortError") {

            status.textContent =
                "エラー：音声生成がタイムアウトしました";

        } else {

            status.textContent =
                "音声エラー：" +
                getErrorMessage(error);

        }
    }
}


/* ================================
   音声認識初期化
   ================================ */

if (!SpeechRecognition) {

    status.textContent =
        "音声認識に対応していません";

} else {

    recognition =
        new SpeechRecognition();

    recognition.lang = "ja-JP";
    recognition.continuous = false;
    recognition.interimResults = false;


    /* ================================
       会話開始 / 終了
       ================================ */

    button.addEventListener(
        "click",
        async () => {

            if (!audioContext) {

                audioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();
            }

            await audioContext.resume();


            /* 会話中なら終了 */

            if (conversationActive) {

                conversationActive = false;

                if (recognitionRunning) {

                    try {
                        recognition.stop();
                    } catch (e) {}

                }

                recognitionRunning = false;


                if (currentSource) {

                    try {
                        currentSource.stop();
                    } catch (e) {}

                    currentSource = null;
                }

                status.textContent =
                    "待機中";

                button.textContent =
                    "🎙️ 話す";

                return;
            }


            /* 会話開始 */

            conversationActive = true;

            button.textContent =
                "⏹️ 終了";

            startListening();

        }
    );


    /* ================================
       音声認識結果
       ================================ */

    recognition.onresult =
        async (event) => {

            recognitionRunning = false;

            const text =
                event.results[0][0].transcript;

            status.textContent =
                "認識：「" +
                text +
                "」";


            await new Promise(
                resolve =>
                    setTimeout(resolve, 300)
            );


            if (!conversationActive) {
                return;
            }


            status.textContent =
                "Geminiへ送信中…";


            try {

                const controller =
                    new AbortController();

                const timeout =
                    setTimeout(() => {

                        controller.abort();

                    }, 240000);


                const response =
                    await fetch("/api/gemini", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            text: text
                        }),

                        signal: controller.signal

                    });


                clearTimeout(timeout);


                const data =
                    await response.json();


                /* ================================
                   Geminiエラー
                   ================================ */

                if (!response.ok) {

                    throw new Error(
                        getErrorMessage(data.error) ||
                        "Gemini HTTP " +
                        response.status
                    );
                }


                if (!data.text) {

                    throw new Error(
                        "Geminiから回答テキストがありません"
                    );
                }


                status.textContent =
                    "J.A.R.V.I.S.：「" +
                    data.text +
                    "」";


                /* TTS */

                await speakWithGemini(
                    data.text
                );


            } catch (error) {

                clearTimeout(timeout);

                if (
                    error.name ===
                    "AbortError"
                ) {

                    status.textContent =
                        "エラー：Geminiへの接続がタイムアウトしました";

                } else {

                    status.textContent =
                        "エラー：" +
                        getErrorMessage(error);

                }
            }
        };


    /* ================================
       音声認識エラー
       ================================ */

    recognition.onerror =
        (event) => {

            recognitionRunning = false;

            status.textContent =
                "音声認識エラー：" +
                event.error;


            if (
                conversationActive &&
                event.error !== "not-allowed" &&
                event.error !== "service-not-allowed"
            ) {

                setTimeout(() => {

                    startListening();

                }, 500);

            }
        };


    /* ================================
       音声認識終了
       ================================ */

    recognition.onend =
        () => {

            recognitionRunning = false;

        };

}

</script>

</body>
</html>
