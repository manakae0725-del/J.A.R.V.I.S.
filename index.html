<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS - 3D Meridian Rings Core UI</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000103;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #0099ff;
        }

        .jarvis-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #010814 0%, #000205 70%, #000000 100%);
        }

        /* 背景ダストパーティクル用Canvas */
        #bgDustCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 縦型ホログラム装置全体コンテナ */
        .hologram-vertical-system {
            position: relative;
            width: 380px;
            height: 620px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transform: scale(var(--system-scale, 1));
            transition: transform 0.3s ease;
            z-index: 2;
            filter: drop-shadow(0 0 35px rgba(0, 119, 255, 0.7));
        }

        @media (min-width: 768px) {
            .hologram-vertical-system { width: 440px; height: 700px; }
        }

        /* ==========================================
           1. 上部固定リング
           ========================================== */
        .hologram-disc-top {
            position: relative;
            width: 260px;
            height: 70px;
            border-radius: 50%;
            transform: rotateX(68deg);
            transform-style: preserve-3d;
            box-shadow: 0 0 22px rgba(0, 136, 255, 0.5);
        }

        .disc-ring-line {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid rgba(0, 136, 255, 0.85);
            box-shadow: inset 0 0 10px rgba(0, 136, 255, 0.5), 0 0 3px rgba(0, 200, 255, 0.3);
        }
        .disc-ring-line:nth-child(1) { inset: 0px; border-width: 2px; border-style: dashed; }
        .disc-ring-line:nth-child(2) { inset: 12px; border-width: 1px; }
        .disc-ring-line:nth-child(3) { inset: 26px; border-width: 3px; border-color: #0088ff; border-left-color: transparent; border-right-color: transparent; }
        .disc-ring-line:nth-child(4) { inset: 40px; border-width: 1px; border-style: dotted; }

        /* ==========================================
           2. 中央 Core ユニット ＋ 硬質な青い金属質感
           ========================================== */
        .core-unit-center {
            position: relative;
            width: 340px;
            height: 340px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        @media (min-width: 768px) {
            .core-unit-center { width: 400px; height: 400px; }
        }

        /* 縦方向の中心線 */
        .vertical-light-beam {
            position: absolute;
            width: 1.5px;
            height: 140%;
            top: -20%;
            background: linear-gradient(to bottom, transparent, rgba(0,136,255,0.9), #ffffff, rgba(0,136,255,0.9), transparent);
            box-shadow: 0 0 20px #0088ff, 0 0 40px #0055ff;
            pointer-events: none;
            z-index: 3;
        }

        /* 斜め楕円リング（エッジにごく薄いシアンの鋭い反射ハイライトを追加） */
        .meridian-orbit-ring {
            position: absolute;
            width: 170px;
            height: 235px;
            border: 1.2px solid rgba(0, 136, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 0 14px rgba(0, 136, 255, 0.6), inset 0 0 10px rgba(0, 180, 255, 0.4), 0 0 4px rgba(0, 220, 255, 0.5);
            pointer-events: none;
            z-index: 4;
        }

        .meridian-1 {
            transform: rotate3d(1, 0.8, 0, 55deg);
            animation: orbitRotate1 18s linear infinite;
        }

        .meridian-2 {
            transform: rotate3d(0.5, -1, 0.5, 70deg);
            animation: orbitRotate2 24s linear infinite;
        }

        .meridian-3 {
            transform: rotate3d(-0.8, 0.5, 1, 40deg);
            animation: orbitRotate3 20s linear infinite;
            border-color: rgba(0, 200, 255, 0.85);
            border-width: 1px;
            border-style: dashed;
            box-shadow: 0 0 14px rgba(0, 136, 255, 0.6), inset 0 0 10px rgba(0, 200, 255, 0.5), 0 0 5px rgba(0, 230, 255, 0.6);
        }

        /* 中央正円Coreスフィア（濃い青の明るさと質感を維持しつつ、ごく薄い金属のエッジ感） */
        .core-sphere-nucleus {
            position: absolute;
            width: 115px;
            height: 115px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #0088ff 30%, #0022aa 75%, #000411 100%);
            box-shadow: 0 0 38px #0077ff, 0 0 75px rgba(0, 85, 255, 0.95), inset 0 0 20px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: corePulse 3.5s ease-in-out infinite;
            z-index: 5;
            border: 1px solid rgba(0, 200, 255, 0.4);
        }

        @media (min-width: 768px) {
            .core-sphere-nucleus { width: 135px; height: 135px; }
        }

        /* JARVIS ロゴタイポグラフィ */
        .jarvis-text-logo {
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.35em;
            color: #ffffff;
            text-shadow: 0 0 10px #0088ff, 0 0 20px #0066ff, 0 0 35px #0044ff;
            z-index: 6;
            animation: textGlow 4s ease-in-out infinite;
        }

        /* ==========================================
           3. 下部固定リング
           ========================================== */
        .hologram-disc-bottom {
            position: relative;
            width: 280px;
            height: 75px;
            border-radius: 50%;
            transform: rotateX(68deg);
            transform-style: preserve-3d;
            box-shadow: 0 0 22px rgba(0, 136, 255, 0.5);
        }

        /* ==========================================
           アニメーション定義
           ========================================== */
        @keyframes orbitRotate1 {
            0% { transform: rotate3d(1, 0.8, 0, 55deg) rotateZ(0deg); }
            100% { transform: rotate3d(1, 0.8, 0, 55deg) rotateZ(360deg); }
        }

        @keyframes orbitRotate2 {
            0% { transform: rotate3d(0.5, -1, 0.5, 70deg) rotateZ(0deg); }
            100% { transform: rotate3d(0.5, -1, 0.5, 70deg) rotateZ(-360deg); }
        }

        @keyframes orbitRotate3 {
            0% { transform: rotate3d(-0.8, 0.5, 1, 40deg) rotateZ(0deg); }
            100% { transform: rotate3d(-0.8, 0.5, 1, 40deg) rotateZ(360deg); }
        }

        @keyframes corePulse {
            0%, 100% {
                transform: scale(0.96);
                box-shadow: 0 0 32px #0077ff, 0 0 65px rgba(0, 85, 255, 0.8), inset 0 0 18px #ffffff;
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 0 48px #0088ff, 0 0 95px rgba(0, 102, 255, 1), inset 0 0 30px #ffffff;
            }
        }

        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 10px #0088ff, 0 0 20px #0066ff; opacity: 0.9; }
            50% { text-shadow: 0 0 15px #0088ff, 0 0 28px #ffffff, 0 0 40px #0044ff; opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="jarvis-screen">
        <!-- 背景の発光・浮遊ダストパーティクル -->
        <canvas id="bgDustCanvas"></canvas>

        <!-- 縦型ホログラム装置システム -->
        <div class="hologram-vertical-system" id="verticalSystem">
            
            <!-- 上部固定リング -->
            <div class="hologram-disc-top">
                <div class="disc-ring-line"></div>
                <div class="disc-ring-line"></div>
                <div class="disc-ring-line"></div>
                <div class="disc-ring-line"></div>
            </div>

            <!-- 中央 Core ユニット -->
            <div class="core-unit-center">
                <!-- 垂直エネルギービーム -->
                <div class="vertical-light-beam"></div>

                <!-- 斜め楕円リング（3本） -->
                <div class="meridian-orbit-ring meridian-1"></div>
                <div class="meridian-orbit-ring meridian-2"></div>
                <div class="meridian-orbit-ring meridian-3"></div>

                <!-- 中央正円スフィア ＆ JARVISロゴ -->
                <div class="core-sphere-nucleus">
                    <div class="jarvis-text-logo">JARVIS</div>
                </div>
            </div>

            <!-- 下部固定リング -->
            <div class="hologram-disc-bottom">
                <div class="disc-ring-line"></div>
                <div class="disc-ring-line"></div>
                <div class="disc-ring-line"></div>
                <div class="disc-ring-line"></div>
            </div>

        </div>
    </div>

    <script>
        // 背景パーティクル（微粒子エフェクト）
        const canvas = document.getElementById('bgDustCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.4,
                color: Math.random() > 0.3 ? 'rgba(0, 136, 255, ' : 'rgba(255, 255, 255, ',
                alpha: Math.random() * 0.7 + 0.2,
                speedY: (Math.random() * 0.4 - 0.2),
                speedX: (Math.random() * 0.2 - 0.1)
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;

                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color + p.alpha + ')';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#0077ff';
                ctx.fill();
            });

            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // 画面サイズに応じた自動スケーリング制御
        function updateSystemScale() {
            const w = window.innerWidth;
            const system = document.getElementById('verticalSystem');
            let scale = 1;

            if (w < 400) {
                scale = 0.8;
            } else if (w >= 1400) {
                scale = 1.2;
            } else {
                scale = 1.0;
            }
            system.style.setProperty('--system-scale', scale);
        }

        window.addEventListener('resize', updateSystemScale);
        updateSystemScale();
    </script>
</body>
</html>
