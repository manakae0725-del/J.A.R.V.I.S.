<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>

<style>
body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 80px;
    font-size: 32px;
    letter-spacing: 6px;
}

button {
    margin-top: 100px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 2px solid #555;
    background: #111;
    color: white;
    font-size: 20px;
}

button:active {
    background: #333;
}

#status {
    margin-top: 30px;
    color: #aaa;
    padding: 0 20px;
    word-break: break-word;
}
</style>
</head>

<body>

<h1>J.A.R.V.I.S.</h1>

<button id="talkButton">🎙️ 話す</button>

<div id="status">待機中</div>

<script>

const button = document.getElementById("talkButton");
const status = document.getElementById("status");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let audioContext = null;
let currentSource = null;


/* Gemini TTSのPCM音声をWAVに変換 */
function pcmToWav(base64) {

    const binary =
        atob(base64);

    const pcm =
        new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        pcm[i] = binary.charCodeAt(i);
    }

    const sampleRate = 24000;
    const channels = 1;
    const bitsPerSample = 16;

    const byteRate =
        sampleRate *
        channels *
        bitsPerSample / 8;

    const blockAlign =
        channels *
        bitsPerSample / 8;

    const buffer =
        new ArrayBuffer(44 + pcm.length);

    const view =
        new DataView(buffer);

    function writeString(offset, string) {
        for (let i = 0; i < string.length; i++) {
            view.setUint8(
                offset + i,
                string.charCodeAt(i)
            );
        }
    }

    writeString(0, "RIFF");

    view.setUint32(
        4,
        36 + pcm.length,
        true
    );

    writeString(8, "WAVE");
    writeString(12, "fmt ");

    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, channels, true);

    view.setUint32(
        24,
        sampleRate,
        true
    );

    view.setUint32(
        28,
        byteRate,
        true
    );

    view.setUint16(
        32,
        blockAlign,
        true
    );

    view.setUint16(
        34,
        bitsPerSample,
        true
    );

    writeString(36, "data");

    view.setUint32(
        40,
        pcm.length,
        true
    );

    new Uint8Array(buffer, 44)
        .set(pcm);

    return new Blob(
        [buffer],
        { type: "audio/wav" }
    );
}


/* Gemini TTS */
async function speakWithGemini(text) {

    status.textContent =
        "J.A.R.V.I.S. 音声生成中…";

    const controller =
        new AbortController();

    const timeout =
        setTimeout(() => {
            controller.abort();
        }, 240000);

    try {

        const response =
            await fetch("/api/tts", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    text: text
                }),

                signal: controller.signal

            });

        clearTimeout(timeout);

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                JSON.stringify(data.error)
            );
        }

        if (!data.audio) {
            throw new Error(
                "音声データがありません"
            );
        }

        const wav =
            pcmToWav(data.audio);

        const arrayBuffer =
            await wav.arrayBuffer();

        const audioBuffer =
            await audioContext.decodeAudioData(
                arrayBuffer
            );

        if (currentSource) {
            currentSource.stop();
        }

        currentSource =
            audioContext.createBufferSource();

        currentSource.buffer =
            audioBuffer;

        currentSource.connect(
            audioContext.destination
        );

        currentSource.onended = () => {

            status.textContent =
                "待機中";

            currentSource = null;
        };

        status.textContent =
            "J.A.R.V.I.S. 発話中…";

        currentSource.start();

    } catch (error) {

        if (error.name === "AbortError") {

            status.textContent =
                "エラー：音声生成がタイムアウトしました";

        } else {

            status.textContent =
                "音声エラー：" +
                error.message;

        }
    }
}


if (!SpeechRecognition) {

    status.textContent =
        "音声認識に対応していません";

} else {

    const recognition =
        new SpeechRecognition();

    recognition.lang = "ja-JP";
    recognition.continuous = false;
    recognition.interimResults = false;


    button.addEventListener("click", async () => {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        await audioContext.resume();

        if (currentSource) {

            currentSource.stop();
            currentSource = null;

        }

        status.textContent =
            "聞いています…";

        recognition.start();

    });


    recognition.onresult = async (event) => {

        const text =
            event.results[0][0].transcript;

        status.textContent =
            "認識：「" + text + "」";

        await new Promise(
            resolve => setTimeout(resolve, 300)
        );

        status.textContent =
            "Geminiへ送信中…";

        try {

            const controller =
                new AbortController();

            const timeout =
                setTimeout(() => {
                    controller.abort();
                }, 240000);

            const response =
                await fetch("/api/gemini", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        text: text
                    }),

                    signal: controller.signal

                });

            clearTimeout(timeout);

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "HTTP " + response.status
                );
            }

            status.textContent =
                "J.A.R.V.I.S.：「" +
                data.text +
                "」";

            await speakWithGemini(data.text);

        } catch (error) {

            if (error.name === "AbortError") {

                status.textContent =
                    "エラー：Geminiへの接続がタイムアウトしました";

            } else {

                status.textContent =
                    "エラー：" +
                    error.message;

            }

        }

    };


    recognition.onerror = (event) => {

        status.textContent =
            "音声認識エラー：" +
            event.error;

    };


    recognition.onend = () => {

        if (
            status.textContent === "聞いています…"
        ) {

            status.textContent =
                "待機中";

        }

    };

}

</script>

</body>
</html>
