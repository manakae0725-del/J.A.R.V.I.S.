<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS - Exact Hologram Core UI</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000103;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #00d9ff;
        }

        /* 画面全体の中央に垂直軸システムを配置 */
        .jarvis-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #041022 0%, #000205 70%, #000000 100%);
        }

        /* 背景ダストパーティクル用Canvas */
        #bgDustCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* ==========================================
           完全な同軸上縦型ホログラム装置全体コンテナ
           ========================================== */
        .hologram-vertical-system {
            position: relative;
            width: 380px;
            height: 620px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transform: scale(var(--system-scale, 1));
            transition: transform 0.3s ease;
            z-index: 2;
            filter: drop-shadow(0 0 35px rgba(0, 217, 255, 0.4));
        }

        @media (min-width: 768px) {
            .hologram-vertical-system { width: 440px; height: 700px; }
        }

        /* ==========================================
           1. 真上の浮遊円盤状リング
           ========================================== */
        .hologram-disc-top {
            position: relative;
            width: 260px;
            height: 70px;
            border-radius: 50%;
            transform: rotateX(68deg);
            transform-style: preserve-3d;
            animation: rotateCW 18s linear infinite;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        .disc-ring-line {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid rgba(0, 217, 255, 0.5);
            box-shadow: inset 0 0 10px rgba(0, 217, 255, 0.3);
        }
        .disc-ring-line:nth-child(1) { inset: 0px; border-width: 2px; border-style: dashed; }
        .disc-ring-line:nth-child(2) { inset: 12px; border-width: 1px; }
        .disc-ring-line:nth-child(3) { inset: 26px; border-width: 3px; border-color: #00d9ff; border-left-color: transparent; border-right-color: transparent; }
        .disc-ring-line:nth-child(4) { inset: 40px; border-width: 1px; border-style: dotted; }

        /* ==========================================
           2. 中央 Core ユニット（完全な正円形HUD ＆ スフィア）
           ========================================== */
        .core-unit-center {
            position: relative;
            width: 340px;
            height: 340px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (min-width: 768px) {
            .core-unit-center { width: 400px; height: 400px; }
        }

        /* 縦軸を貫くエネルギー柱の光線 */
        .vertical-light-beam {
            position: absolute;
            width: 4px;
            height: 140%;
            top: -20%;
            background: linear-gradient(to bottom, transparent, rgba(0,217,255,0.7), #ffffff, rgba(0,217,255,0.7), transparent);
            box-shadow: 0 0 25px #00d9ff, 0 0 50px #00d9ff;
            pointer-events: none;
            z-index: 5;
        }

        /* 多重同心円HUDリング (SVG描画による精密な正円構造) */
        .hud-svg-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .ring-spin-cw-1 { animation: rotateCW 25s linear infinite; transform-origin: center; }
        .ring-spin-ccw-1 { animation: rotateCCW 30s linear infinite; transform-origin: center; opacity: 0.85; }
        .ring-spin-cw-2 { animation: rotateCW 12s linear infinite; transform-origin: center; opacity: 0.95; }

        /* CSSによる同心円アーク・セグメント */
        .hud-css-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        .hud-arc-outer {
            width: 94%;
            height: 94%;
            border: 2px solid transparent;
            border-top: 3px solid rgba(0, 217, 255, 0.9);
            border-bottom: 3px solid rgba(0, 217, 255, 0.9);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.4);
            animation: rotateCW 15s linear infinite;
        }
        .hud-dashed-circle {
            width: 82%;
            height: 82%;
            border: 2px dashed rgba(0, 217, 255, 0.4);
            animation: rotateCCW 22s linear infinite;
        }
        .hud-block-segments {
            width: 68%;
            height: 68%;
            border: 3px solid transparent;
            border-left: 5px solid #00d9ff;
            border-right: 5px solid #00d9ff;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.6);
            animation: rotateCW 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* 中央の最も眩しく光る正円Coreサークル */
        .core-sphere-nucleus {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #00d9ff 35%, #0048cc 75%, #010a1a 100%);
            box-shadow: 0 0 40px #00d9ff, 0 0 80px rgba(0, 217, 255, 0.8), inset 0 0 25px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: corePulse 3.5s ease-in-out infinite;
            z-index: 6;
        }

        @media (min-width: 768px) {
            .core-sphere-nucleus { width: 160px; height: 160px; }
        }

        /* JARVIS ロゴタイポグラフィ */
        .jarvis-text-logo {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 0.4em;
            color: #ffffff;
            text-shadow: 0 0 10px #00d9ff, 0 0 20px #00d9ff, 0 0 35px #00d9ff;
            z-index: 7;
            animation: textGlow 4s ease-in-out infinite;
        }

        /* ==========================================
           3. 真下の浮遊円盤状リング
           ========================================== */
        .hologram-disc-bottom {
            position: relative;
            width: 280px;
            height: 75px;
            border-radius: 50%;
            transform: rotateX(68deg);
            transform-style: preserve-3d;
            animation: rotateCCW 20s linear infinite;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        /* ==========================================
           アニメーション定義
           ========================================== */
        @keyframes rotateCW {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCCW {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        @keyframes corePulse {
            0%, 100% {
                transform: scale(0.96);
                box-shadow: 0 0 35px #00d9ff, 0 0 70px rgba(0, 217, 255, 0.6), inset 0 0 20px #ffffff;
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 0 50px #00d9ff, 0 0 100px rgba(0, 217, 255, 0.9), inset 0 0 35px #ffffff;
            }
        }

        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 10px #00d9ff, 0 0 20px #00d9ff; opacity: 0.9; }
            50% { text-shadow: 0 0 15px #00d9ff, 0 0 30px #ffffff, 0 0 45px #00d9ff; opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="jarvis-screen">
        <!-- 背景の発光・浮遊ダストパーティクル -->
        <canvas id="bgDustCanvas"></canvas>

        <!-- 同軸縦型ホログラム装置システム -->
        <div class="hologram-vertical-system" id="verticalSystem">
            
            <!-- 上部浮遊円盤リング -->
            <div class="hologram-disc-top">
                <div class="disc-ring-line"></div>
                <div class="disc-ring-line"></div>
                <div class="disc-ring-line"></div>
                <div class="disc-ring-line"></div>
            </div>

            <!-- 中央 Core ユニット（縦エネルギー軸 ＆ 同心円HUD ＆ 正円スフィア） -->
            <div class="core-unit-center">
                <!-- 垂直エネルギービーム -->
                <div class="vertical-light-beam"></div>

                <!-- SVG精密同心円リング -->
                <svg class="hud-svg-ring ring-spin-cw-1" viewBox="0 0 300 300">
                    <circle cx="150" cy="150" r="142" fill="none" stroke="rgba(0,217,255,0.3)" stroke-width="1.5" stroke-dasharray="12 6 3 6"/>
                    <circle cx="150" cy="150" r="130" fill="none" stroke="rgba(0,217,255,0.6)" stroke-width="2" stroke-dasharray="45 20 5 15"/>
                </svg>

                <svg class="hud-svg-ring ring-spin-ccw-1" viewBox="0 0 300 300">
                    <circle cx="150" cy="150" r="115" fill="none" stroke="rgba(0,217,255,0.4)" stroke-width="1" stroke-dasharray="6 12"/>
                    <circle cx="150" cy="150" r="100" fill="none" stroke="rgba(0,217,255,0.7)" stroke-width="2" stroke-dasharray="80 40 20 10"/>
                </svg>

                <svg class="hud-svg-ring ring-spin-cw-2" viewBox="0 0 300 300">
                    <circle cx="150" cy="150" r="84" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-dasharray="15 30 10 15"/>
                </svg>

                <!-- CSSセグメントリング -->
                <div class="hud-css-ring hud-arc-outer"></div>
                <div class="hud-css-ring hud-dashed-circle"></div>
                <div class="hud-css-ring hud-block-segments"></div>

                <!-- 中央正円スフィア ＆ JARVISロゴ -->
                <div class="core-sphere-nucleus">
                    <div class="jarvis-text-logo">JARVIS</div>
                </div>
            </div>

            <!-- 下部浮遊円盤リング -->
            <div class="hologram-disc-bottom">
                <div class="disc-ring-line"></div>
                <div class="disc-ring-line"></div>
                <div class="disc-ring-line"></div>
                <div class="disc-ring-line"></div>
            </div>

        </div>
    </div>

    <script>
        // 背景パーティクル（微粒子エフェクト）
        const canvas = document.getElementById('bgDustCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.4,
                color: Math.random() > 0.3 ? 'rgba(0, 217, 255, ' : 'rgba(255, 255, 255, ',
                alpha: Math.random() * 0.7 + 0.2,
                speedY: (Math.random() * 0.4 - 0.2),
                speedX: (Math.random() * 0.2 - 0.1)
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;

                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color + p.alpha + ')';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00d9ff';
                ctx.fill();
            });

            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // 画面サイズに応じた自動スケーリング制御
        function updateSystemScale() {
            const w = window.innerWidth;
            const system = document.getElementById('verticalSystem');
            let scale = 1;

            if (w < 400) {
                scale = 0.8;
            } else if (w >= 1400) {
                scale = 1.2;
            } else {
                scale = 1.0;
            }
            system.style.setProperty('--system-scale', scale);
        }

        window.addEventListener('resize', updateSystemScale);
        updateSystemScale();
    </script>
</body>
</html>
