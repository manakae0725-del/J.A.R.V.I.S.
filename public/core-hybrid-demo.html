<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>J.A.R.V.I.S. Core Hybrid Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}
.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;font:10px Arial,sans-serif;letter-spacing:.22em;color:rgba(140,200,255,.4);pointer-events:none}
</style></head><body><canvas id="c"></canvas><div class="hint">CORE IMAGE + PARTICLE FIELD + HOLOGRAPHIC RINGS</div>
<script>
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d');
let w,h,dpr,cx,cy,scale,t=0,drag=false,lastX=0,rot=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);cx=w/2;cy=h/2;scale=Math.min(w,h)/700}
addEventListener('resize',resize);resize();
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(drag){rot+=(e.clientX-lastX)*.008;lastX=e.clientX}});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
let seed=12345;function rand(){seed=(seed*9301+49297)%233280;return seed/233280}
const particles=Array.from({length:700},()=>({a:rand()*Math.PI*2,r:rand(),z:rand()*2-1,s:.22+rand()*.48,phase:rand()*Math.PI*2,speed:.15+rand()*.55}));
const stars=Array.from({length:90},()=>({x:rand(),y:rand(),a:.15+rand()*.42,r:.35+rand()*.95}));
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function ring(rx,ry,tilt,phase,alpha,width){
 ctx.save();ctx.translate(cx,cy);ctx.rotate(tilt+rot*.16);ctx.beginPath();
 for(let i=0;i<=220;i++){const a=i/220*Math.PI*2+phase+rot*.12;const x=Math.cos(a)*rx,y=Math.sin(a)*ry*(.78+.22*Math.sin(a+rot));i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
 ctx.strokeStyle='rgba(15,95,230,'+(alpha*.9)+')';ctx.lineWidth=width;ctx.shadowColor='#167bff';ctx.shadowBlur=14;ctx.stroke();ctx.restore();
}
function drawCore(r){
 // Layered translucent gradients create a glass-like, holographic Core.
 const g=ctx.createRadialGradient(cx-r*.3,cy-r*.34,r*.04,cx,cy,r*1.08);
 g.addColorStop(0,'rgba(215,255,255,.66)');
 g.addColorStop(.18,'rgba(45,230,255,.52)');
 g.addColorStop(.38,'rgba(0,105,245,.42)');
 g.addColorStop(.68,'rgba(0,48,170,.38)');
 g.addColorStop(.88,'rgba(0,28,115,.3)');
 g.addColorStop(1,'rgba(0,100,230,.18)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
 const rim=ctx.createRadialGradient(cx,cy,r*.68,cx,cy,r);
 rim.addColorStop(0,'rgba(70,210,255,0)');
 rim.addColorStop(.72,'rgba(70,210,255,.02)');
 rim.addColorStop(1,'rgba(80,165,255,.32)');
 ctx.fillStyle=rim;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,r-1,0,Math.PI*2);ctx.clip();
 // A fine, original-style dotted Voronoi boundary texture, not a 3D replacement.
 for(let x=cx-r;x<=cx+r;x+=5){for(let y=cy-r;y<=cy+r;y+=5){if(Math.hypot(x-cx,y-cy)>=r)continue;let d1=1e9,d2=1e9;for(const p of corePts){const d=Math.hypot(x-p.x,y-p.y);if(d<d1){d2=d1;d1=d}else if(d<d2)d2=d}if(Math.abs(d1-d2)<1.2){ctx.fillStyle='rgba(55,165,255,.36)';ctx.fillRect(x,y,1,1)}}}
 corePts.forEach(p=>{ctx.fillStyle='rgba(120,195,255,.62)';ctx.beginPath();ctx.arc(p.x,p.y,1.15,0,Math.PI*2);ctx.fill()});
 ctx.restore();

 // Small highlight centered precisely on the Core's geometric center.
 const glowX=cx,glowY=cy,glowR=r*.085;
 const coreGlow=ctx.createRadialGradient(glowX,glowY,0,glowX,glowY,glowR);
 coreGlow.addColorStop(0,'rgba(235,250,255,.62)');
 coreGlow.addColorStop(.3,'rgba(95,185,255,.34)');
 coreGlow.addColorStop(1,'rgba(0,90,255,0)');
 ctx.fillStyle=coreGlow;ctx.beginPath();ctx.arc(glowX,glowY,glowR,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.font='bold '+(r*.18)+'px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#00baff';ctx.shadowBlur=8;ctx.fillStyle='#fff';ctx.fillText('J  A  R  V  I  S',cx,cy);ctx.restore();
}
let corePts=[];
for(let i=0;i<85;i++){const a=rand()*Math.PI*2,rr=Math.sqrt(rand())*176;corePts.push({x:500+rr*Math.cos(a),y:500+rr*Math.sin(a)})}
function frame(){
 requestAnimationFrame(frame);t+=.016;ctx.clearRect(0,0,w,h);ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
 stars.forEach(s=>{ctx.fillStyle='rgba(45,120,255,'+(s.a*(.65+.35*Math.sin(t+s.x*10))+0.04)+')';ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r,0,Math.PI*2);ctx.fill()});
 const r=Math.min(w,h)*.175;
 // Long crosshair beams behind the Core, extending across the full viewport.
 const beamGradH=ctx.createLinearGradient(0,cy,w,cy);
 beamGradH.addColorStop(0,'rgba(0,120,255,0)');
 beamGradH.addColorStop(.18,'rgba(30,105,255,.3)');
 beamGradH.addColorStop(.42,'rgba(85,175,255,.68)');
 beamGradH.addColorStop(.5,'rgba(175,215,255,.92)');
 beamGradH.addColorStop(.58,'rgba(120,225,255,.58)');
 beamGradH.addColorStop(.82,'rgba(30,160,255,.18)');
 beamGradH.addColorStop(1,'rgba(0,120,255,0)');
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.shadowColor='#008cff';ctx.shadowBlur=9;
 line(0,cy,w,cy,beamGradH,.8);
 const beamGradV=ctx.createLinearGradient(cx,0,cx,h);
 beamGradV.addColorStop(0,'rgba(0,120,255,0)');
 beamGradV.addColorStop(.18,'rgba(30,160,255,.18)');
 beamGradV.addColorStop(.42,'rgba(120,225,255,.58)');
 beamGradV.addColorStop(.5,'rgba(225,250,255,.9)');
 beamGradV.addColorStop(.58,'rgba(120,225,255,.58)');
 beamGradV.addColorStop(.82,'rgba(30,160,255,.18)');
 beamGradV.addColorStop(1,'rgba(0,120,255,0)');
 line(cx,0,cx,h,beamGradV,.8);
 ctx.restore();
 // Layered rings behind the unchanged graphic core.
 ring(r*1.55,r*1.08,-.55,t*.13,.36,1);
 ring(r*1.72,r*.72,.48,-t*.17,.28,.8);
 ring(r*1.92,r*1.36,.12,t*.07,.17,.7);
 ring(r*1.34,r*1.31,.9,-t*.1,.22,.65);
 // Short segmented HUD ticks around the outer orbital path.
 ctx.save();ctx.translate(cx,cy);ctx.rotate(rot*.15+t*.025);
 for(let i=0;i<96;i++){const a=i*Math.PI*2/96;const major=i%8===0;const inner=r*(major?1.72:1.78),outer=r*(major?1.86:1.82);line(Math.cos(a)*inner,Math.sin(a)*inner,Math.cos(a)*outer,Math.sin(a)*outer,'rgba(55,135,255,'+(major?.82:.38)+')',major?1:.6)}
 ctx.restore();
 // Particle flow surrounds and lightly overlaps the core silhouette.
 particles.forEach(p=>{
  const a=p.a+t*p.speed*.22+rot*.08;
  const spread=(.88+p.z*.13+Math.sin(t*1.1+p.phase)*.025)*r*1.22;
  const rr=spread*(.68+p.r*.42);
  const x=cx+Math.cos(a)*rr;
  const y=cy+Math.sin(a)*rr*(.86+p.z*.1);
  const twinkle=.35+.65*(.5+.5*Math.sin(t*2+p.phase));
  ctx.fillStyle='rgba(95,175,255,'+(twinkle*(p.r>.78?.95:.62))+')';
  ctx.shadowColor='#1685ff';ctx.shadowBlur=p.r>.82?10:4;
  ctx.beginPath();ctx.arc(x,y,p.s*(p.r>.88?1.15:.75),0,Math.PI*2);ctx.fill();
 });
 ctx.shadowBlur=0;
 // Core remains a flat graphic at the center; particles and 3D-style orbit rings add depth.
 drawCore(r);
 // Fine particles crossing the foreground give a subtle layered effect.
 particles.filter(p=>p.r>.9).forEach(p=>{const a=p.a-t*p.speed*.16;const rr=r*(.72+Math.sin(t+p.phase)*.05);const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*.8;ctx.fillStyle='rgba(135,200,255,.8)';ctx.beginPath();ctx.arc(x,y,p.s*.5,0,Math.PI*2);ctx.fill()});
}
frame();
</script></body></html>
