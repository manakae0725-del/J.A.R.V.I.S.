<title>J.A.R.V.I.S. Core Hybrid Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}
.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;font:10px Arial,sans-serif;letter-spacing:.22em;color:rgba(140,200,255,.4);pointer-events:none}
</style></head><body><canvas id="c"></canvas><div class="hint">CORE IMAGE + PARTICLE FIELD + HOLOGRAPHIC RINGS</div>
<script>
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d');
let w,h,dpr,cx,cy,scale,t=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);cx=w/2;cy=h*.20;scale=Math.min(w,h)/700}
addEventListener('resize',resize);resize();
let seed=12345;function rand(){seed=(seed*9301+49297)%233280;return seed/233280}
const particles=Array.from({length:1120},()=>({a:rand()*Math.PI*2,r:rand(),z:rand()*2-1,s:(rand()<.72?.25+rand()*.27:rand()<.88?.52+rand()*.32:.88+rand()*.48),phase:rand()*Math.PI*2,speed:.15+rand()*.55,brightness:.35+rand()*.65,blur:rand()}));
const stars=Array.from({length:90},()=>({x:rand(),y:rand(),a:.15+rand()*.42,r:.35+rand()*.95}));
// Segmented precision HUD ticks: isolated marks, never a continuous circular outline.
 const hudTicks=Array.from({length:64},(_,i)=>({a:(i/64)*Math.PI*2+(rand()-.5)*.018,len:i%8===0?7+rand()*3:i%4===0?4+rand()*2:2+rand()*2,offset:rand()*5,alpha:.18+rand()*.42}));
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function drawCore(r){
 // Layered translucent gradients create a glass-like, holographic Core.
 const g=ctx.createRadialGradient(cx,cy,r*.08,cx,cy,r*1.08);
 g.addColorStop(0,'rgba(45,150,255,.28)');
 g.addColorStop(.18,'rgba(25,125,255,.36)');
 g.addColorStop(.38,'rgba(0,105,245,.42)');
 g.addColorStop(.68,'rgba(0,48,170,.38)');
 g.addColorStop(.88,'rgba(0,28,115,.3)');
 g.addColorStop(1,'rgba(0,100,230,.18)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
 const rim=ctx.createRadialGradient(cx,cy,r*.68,cx,cy,r);
 rim.addColorStop(0,'rgba(70,210,255,0)');
 rim.addColorStop(.72,'rgba(70,210,255,.02)');
 rim.addColorStop(1,'rgba(80,165,255,.07)');
 ctx.fillStyle=rim;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,r-1,0,Math.PI*2);ctx.clip();
 // A fine, original-style dotted Voronoi boundary texture, not a 3D replacement.
 for(let x=cx-r;x<=cx+r;x+=5){for(let y=cy-r;y<=cy+r;y+=5){if(Math.hypot(x-cx,y-cy)>=r)continue;let d1=1e9,d2=1e9;for(const p of corePts){const d=Math.hypot(x-p.x,y-p.y);if(d<d1){d2=d1;d1=d}else if(d<d2)d2=d}if(Math.abs(d1-d2)<1.2){ctx.fillStyle='rgba(55,165,255,.24)';ctx.fillRect(x,y,1,1)}}}
 corePts.forEach(p=>{ctx.fillStyle='rgba(120,195,255,.62)';ctx.beginPath();ctx.arc(p.x,p.y,1.15,0,Math.PI*2);ctx.fill()});
 ctx.restore();

 // Strong center light with a broad radial falloff reaching the Core's outer edge.
 const glowR=r*1.02;
 const blueGlow=ctx.createRadialGradient(cx,cy,0,cx,cy,glowR);
 blueGlow.addColorStop(0,'rgba(185,235,255,.95)');
 blueGlow.addColorStop(.12,'rgba(45,155,255,.72)');
 blueGlow.addColorStop(.34,'rgba(0,105,255,.38)');
 blueGlow.addColorStop(.62,'rgba(0,75,235,.2)');
 blueGlow.addColorStop(.84,'rgba(0,55,200,.1)');
 blueGlow.addColorStop(1,'rgba(0,45,170,0)');
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.shadowColor='#1685ff';ctx.shadowBlur=36;
 ctx.fillStyle=blueGlow;ctx.beginPath();ctx.arc(cx,cy,glowR,0,Math.PI*2);ctx.fill();ctx.restore();

 // Removed the misplaced highlight.
 ctx.save();ctx.font='700 '+(r*.23)+'px "Eurostile", "Bank Gothic", "Arial", sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.letterSpacing=(r*.045)+'px';ctx.shadowColor='#00baff';ctx.shadowBlur=8;ctx.fillStyle='#fff';ctx.fillText('J.A.R.V.I.S.',cx,cy);ctx.restore();
}
let corePts=[];
for(let i=0;i<21;i++){const a=rand()*Math.PI*2,rr=Math.sqrt(rand())*176;corePts.push({x:500+rr*Math.cos(a),y:500+rr*Math.sin(a)})}
function frame(){
 requestAnimationFrame(frame);t+=.016;ctx.clearRect(0,0,w,h);ctx.fillStyle='#020817';ctx.fillRect(0,0,w,h);
 stars.forEach(s=>{ctx.fillStyle='rgba(45,120,255,'+(s.a*(.65+.35*Math.sin(t+s.x*10))+0.04)+')';ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r,0,Math.PI*2);ctx.fill()});
 // Peripheral cyber-HUD: restrained data traces and segmented markers on the black field, separate from the Core.
 ctx.save();ctx.globalCompositeOperation='screen';
 const hudC='rgba(28,190,255,';

 // Fine framing corners.

 const cl=Math.min(w,h)*.045;
 [[pad,pad,1,1],[w-pad,pad,-1,1],[pad,h-pad,1,-1],[w-pad,h-pad,-1,-1]].forEach(([x,y,sx,sy])=>{
  ctx.beginPath();ctx.moveTo(x+sx*cl,y);ctx.lineTo(x,y);ctx.lineTo(x,y+sy*cl);ctx.stroke();
 });
 // Top and bottom segmented telemetry scales.
 for(let i=0;i<Math.floor(w/22);i++){
  const x=i*22+11, long=i%5===0;
  const alpha=.12+(i%7===0?.2:0);
  const major=i%10===0, medium=i%5===0;
  ctx.strokeStyle=hudC+(major?'.58)':medium?'.34)':alpha+')');ctx.lineWidth=major?2.2:medium?1.5:1;
  ctx.beginPath();ctx.moveTo(x,pad*.62);ctx.lineTo(x,pad*.62+(major?13:medium?8:3));ctx.stroke();

 }

 for(let side=0;side<2;side++){
  const sx=side===0?pad:w-pad, dir=side===0?1:-1;

   const yy=h*(.22+j*.125);
   const bw=Math.min(w*.07,24+(j%3)*12);
   ctx.strokeStyle=hudC+(.12+(j%2)*.08)+')';ctx.lineWidth=1;
   ctx.beginPath();ctx.moveTo(sx,yy);ctx.lineTo(sx+dir*bw,yy);ctx.lineTo(sx+dir*bw,yy+8+(j%2)*5);ctx.lineTo(sx+dir*bw*.62,yy+8+(j%2)*5);ctx.stroke();
   for(let k=0;k<3+(j%3);k++){

  ctx.strokeStyle=hudC+(.1+(i%3)*.035)+')';ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(startX,yy);ctx.lineTo(startX+side*18,yy);ctx.lineTo(startX+side*18,bendY);ctx.lineTo(endX,bendY);ctx.stroke();
  ctx.fillStyle=hudC+'.42)';ctx.beginPath();ctx.arc(startX,yy,1.7,0,Math.PI*2);ctx.fill();
 }
 // A few compact telemetry bars at the far edges.

  const x=side===0?pad+4:w-pad-4;

   const yy=h*.79+j*4;
   const len=5+((j*7)%4)*3;

 // Barely visible technical illustrations on the black field, outside the Core's internal texture.
 ctx.save();ctx.globalCompositeOperation='screen';ctx.lineWidth=.8;
 const da=.075;ctx.strokeStyle='rgba(55,190,255,'+da+')';ctx.fillStyle='rgba(55,190,255,'+(da*.7)+')';
 // Left wireframe scan.
 {const x=w*.13,y=h*.43,rr=Math.min(w,h)*.105;
  ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.ellipse(x,y,rr*.42,rr,0,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.ellipse(x,y,rr,rr*.34,-.25,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.ellipse(x,y,rr*.72,rr,.55,0,Math.PI*2);ctx.stroke();
  for(let k=0;k<5;k++){const yy=y-rr*.72+k*rr*.36;ctx.beginPath();ctx.moveTo(x-rr*.92,yy);ctx.lineTo(x+rr*.92,yy);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(x-rr*1.18,y);ctx.lineTo(x+rr*1.18,y);ctx.moveTo(x,y-rr*1.18);ctx.lineTo(x,y+rr*1.18);ctx.stroke();
 }
 // Upper-right mechanical cross-section.
 {const x=w*.84,y=h*.28,rr=Math.min(w,h)*.085;
  [1,.76,.48,.2].forEach(q=>{ctx.beginPath();ctx.arc(x,y,rr*q,0,Math.PI*2);ctx.stroke()});
  for(let k=0;k<16;k++){const a=k*Math.PI/8+t*.015;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*rr*.8,y+Math.sin(a)*rr*.8);ctx.lineTo(x+Math.cos(a)*rr*1.08,y+Math.sin(a)*rr*1.08);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(x-rr*.55,y-rr*.22);ctx.lineTo(x-rr*.18,y-rr*.22);ctx.lineTo(x,y-rr*.52);ctx.lineTo(x+rr*.34,y-rr*.52);ctx.moveTo(x-rr*.48,y+rr*.32);ctx.lineTo(x-rr*.12,y+rr*.32);ctx.lineTo(x+rr*.1,y+rr*.08);ctx.lineTo(x+rr*.5,y+rr*.08);ctx.stroke();
 }
 // Lower-right diagnostic waveform.
 {const x=w*.79,y=h*.77,ww=Math.min(w*.18,190),hh=Math.min(h*.11,72);
  for(let k=0;k<=4;k++){const yy=y-hh/2+k*hh/4;ctx.beginPath();ctx.moveTo(x-ww/2,yy);ctx.lineTo(x+ww/2,yy);ctx.stroke()}
  for(let k=0;k<=8;k++){const xx=x-ww/2+k*ww/8;ctx.beginPath();ctx.moveTo(xx,y-hh/2);ctx.lineTo(xx,y+hh/2);ctx.stroke()}
  ctx.beginPath();for(let j=0;j<=90;j++){const u=j/90,xx=x-ww/2+u*ww,yy=y+Math.sin(u*18+t*.35)*Math.sin(u*Math.PI)*hh*.34+Math.sin(u*43-t*.2)*hh*.06;if(j===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.stroke();
 }
 // Lower-left orbital node diagram.
 {const x=w*.16,y=h*.77,rr=Math.min(w,h)*.06,nodes=[[-.8,-.15],[-.3,-.72],[.35,-.45],[.78,.05],[.25,.62],[-.42,.48]];
  ctx.beginPath();nodes.forEach((p,i)=>{const nx=x+p[0]*rr*1.3,ny=y+p[1]*rr*1.3;if(i===0)ctx.moveTo(nx,ny);else ctx.lineTo(nx,ny)});ctx.closePath();ctx.stroke();
  nodes.forEach(p=>{const nx=x+p[0]*rr*1.3,ny=y+p[1]*rr*1.3;ctx.beginPath();ctx.arc(nx,ny,2.2,0,Math.PI*2);ctx.stroke()});
  ctx.beginPath();ctx.ellipse(x,y,rr*.55,rr*1.15,-.5,0,Math.PI*2);ctx.stroke();
 }
 ctx.restore();
 const r=Math.min(w,h)*.145;
 // Soft blue mist drifting around the Core; kept translucent so the silhouette stays readable.
 ctx.save();ctx.globalCompositeOperation='screen';
 for(let i=0;i<9;i++){
  const a=t*(.045+(i%3)*.012)+i*2.399;
  const orbitR=r*(1.03+(i%4)*.16);
  const mx=cx+Math.cos(a)*orbitR;
  const my=cy+Math.sin(a)*orbitR*.72;
  const mr=r*(.24+(i%3)*.09);
  const mist=ctx.createRadialGradient(mx,my,0,mx,my,mr);
  const mistAlpha=.018+.012*(.5+.5*Math.sin(t*.55+i*1.8));
  mist.addColorStop(0,'rgba(70,155,255,'+mistAlpha+')');
  mist.addColorStop(.55,'rgba(45,120,255,'+(mistAlpha*.45)+')');
  mist.addColorStop(1,'rgba(35,100,255,0)');
  ctx.fillStyle=mist;ctx.beginPath();ctx.ellipse(mx,my,mr*1.35,mr*.72,a*.2,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
 // Stronger spacetime lensing: broad refractive haze and gently warped light bands, without ripple arcs.
 const warpPulse=.5+.5*Math.sin(t*.72);
 ctx.save();ctx.globalCompositeOperation='lighter';
 const band=ctx.createRadialGradient(cx,cy,r*.9,cx,cy,r*1.9);
 band.addColorStop(0,'rgba(35,135,255,0)');
 band.addColorStop(.3,'rgba(35,135,255,0)');
 band.addColorStop(.43,'rgba(55,155,255,'+(.065+.025*warpPulse)+')');
 band.addColorStop(.55,'rgba(95,205,255,'+(.11+.035*warpPulse)+')');
 band.addColorStop(.66,'rgba(45,135,255,'+(.07+.025*warpPulse)+')');
 band.addColorStop(.82,'rgba(35,115,255,.028)');
 band.addColorStop(1,'rgba(35,115,255,0)');
 ctx.fillStyle=band;ctx.beginPath();ctx.arc(cx,cy,r*1.9,0,Math.PI*2);ctx.fill();
 // Curved refraction bands bend around the Core, like light passing through a distorted lens.
 for(let i=0;i<7;i++){
  const yy=cy-r*1.05+i*r*.35+Math.sin(t*.42+i*1.7)*4;
  const span=r*(1.28+.22*Math.sin(t*.5+i));
  const fade=ctx.createLinearGradient(cx-span,yy,cx+span,yy);
  fade.addColorStop(0,'rgba(70,175,255,0)');
  fade.addColorStop(.25,'rgba(70,175,255,'+(.035+.016*warpPulse)+')');
  fade.addColorStop(.5,'rgba(135,220,255,'+(.06+.02*warpPulse)+')');
  fade.addColorStop(.75,'rgba(70,175,255,'+(.035+.016*warpPulse)+')');
  fade.addColorStop(1,'rgba(70,175,255,0)');
  ctx.strokeStyle=fade;ctx.lineWidth=1.25;

  ctx.moveTo(cx-span,yy);
  ctx.bezierCurveTo(cx-span*.45,yy+Math.sin(t*.7+i)*r*.13,cx+span*.35,yy-Math.cos(t*.6+i)*r*.16,cx+span,yy);
  ctx.stroke();
 }
 ctx.restore();ctx.shadowBlur=0;
 // Long crosshair beams behind the Core, extending across the full viewport.
 const beamGradH=ctx.createLinearGradient(0,cy,w,cy);
 beamGradH.addColorStop(0,'rgba(0,120,255,0)');
 beamGradH.addColorStop(.18,'rgba(30,105,255,.3)');
 beamGradH.addColorStop(.42,'rgba(85,175,255,.68)');
 beamGradH.addColorStop(.5,'rgba(175,215,255,.92)');
 beamGradH.addColorStop(.58,'rgba(120,225,255,.58)');
 beamGradH.addColorStop(.82,'rgba(30,160,255,.18)');
 beamGradH.addColorStop(1,'rgba(0,120,255,0)');
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.shadowColor='#008cff';ctx.shadowBlur=9;
 line(0,cy,w,cy,beamGradH,.8);
 const beamGradV=ctx.createLinearGradient(cx,0,cx,h);
 beamGradV.addColorStop(0,'rgba(0,120,255,0)');
 beamGradV.addColorStop(.18,'rgba(30,160,255,.18)');
 beamGradV.addColorStop(.42,'rgba(120,225,255,.58)');
 beamGradV.addColorStop(.5,'rgba(225,250,255,.9)');
 beamGradV.addColorStop(.58,'rgba(120,225,255,.58)');
 beamGradV.addColorStop(.82,'rgba(30,160,255,.18)');
 beamGradV.addColorStop(1,'rgba(0,120,255,0)');
 line(cx,0,cx,h,beamGradV,.8);
 ctx.restore();
 // Particle flow surrounds and lightly overlaps the core silhouette.
 particles.forEach(p=>{
  const a=p.a+t*p.speed*.22+rot*.08;
  const spread=(2.75+Math.sin(t*1.1+p.phase)*.045)*r;

  ctx.beginPath();ctx.arc(x,y,p.s,0,Math.PI*2);ctx.fill();
 });
 ctx.shadowBlur=0;
 // Core remains a flat graphic at the center; particles and 3D-style orbit rings add depth.
 drawCore(r);
 // Animated holographic projection platform beneath the Core.
 {

   ctx.strokeStyle='rgba(80,190,255,'+((j===0?.48:.2)*pulse)+')';

  ctx.fillStyle=glow;ctx.beginPath();ctx.ellipse(cx,py,rx*1.05,ry*1.6,0,0,Math.PI*2);ctx.fill();
  for(let i=0;i<8;i++){
