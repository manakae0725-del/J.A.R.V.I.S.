<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>J.A.R.V.I.S. Core</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
main{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:#000;isolation:isolate}
#rings{position:absolute;z-index:1;width:min(82vw,70vh);height:auto;object-fit:contain;object-position:center;pointer-events:none;user-select:none}
#core{position:absolute;z-index:2;width:min(119vw,66vh);max-height:66vh;height:auto;object-fit:contain;object-position:center;clip-path:circle(39% at 50% 50%);mix-blend-mode:screen;transform:translate(-2px,15px);pointer-events:auto;user-select:none;-webkit-user-drag:none}
#error{position:fixed;z-index:3;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:#9bdfff;font:13px Arial,sans-serif;pointer-events:none}
@media (max-width:600px){
 #rings{width:min(82vw,58vh)}
 #core{width:min(119vw,66vh);max-height:66vh}
}
</style>
</head>
<body>
<main>
 <img id="rings" src="/jarvis-orbit-rings.png" alt="" aria-hidden="true">
 <img id="core" src="/jarvis-core.jpg%20.PNG" alt="J.A.R.V.I.S. Core">
</main>
<div id="error">Core画像またはリング画像を読み込めません。</div>
<script>
const core=document.querySelector('#core');
const rings=document.querySelector('#rings');
const error=document.querySelector('#error');
function checkImages(){if(!core.complete||!rings.complete)return;error.style.display=(!core.naturalWidth||!rings.naturalWidth)?'grid':'none'}
core.addEventListener('error',checkImages);
rings.addEventListener('error',checkImages);
core.addEventListener('load',checkImages);
rings.addEventListener('load',checkImages);
if(core.complete&&rings.complete)checkImages();
</script>
</body>
</html>
