<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>J.A.R.V.I.S. Core</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
main{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;transform:scale(1.05)}
#rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#error{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:#9bdfff;font:13px Arial,sans-serif}
</style>
</head>
<body>
<main>
<img id="art" src="/jarvis-core.jpg%20.PNG" alt="J.A.R.V.I.S. Core">
<canvas id="rings"></canvas>
</main>
<div id="error">Core画像またはリング表示を読み込めません。</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const image=document.querySelector('#art');
const canvas=document.querySelector('#rings');
const error=document.querySelector('#error');
let renderer,camera;
const scene=new THREE.Scene();

try{
 renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
 renderer.setSize(innerWidth,innerHeight);
 renderer.setClearColor(0x000000,0);
}catch(e){error.style.display='grid';throw e}

camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,100);
camera.position.z=12;

const RING_COLOR=0x42cfff;
const ringSpecs=[
 {rotation:[1.02,0,-.55],opacity:.68,z:0,radius:1.39,speed:.34,phase:0},
 {rotation:[1.02,0,.55],opacity:.58,z:-.025,radius:1.39,speed:-.29,phase:2.2},
 {rotation:[.48,.82,-.42],opacity:.54,z:.018,radius:1.39,speed:.25,phase:4.1},
 {rotation:[.48,-.82,.42],opacity:.50,z:-.045,radius:1.39,speed:-.31,phase:1.1},
 {rotation:[1.34,.28,.18],opacity:.40,z:.055,radius:1.43,speed:.22,phase:3.2},
 {rotation:[.28,1.28,-.72],opacity:.38,z:-.065,radius:1.43,speed:-.26,phase:5.0},
 {rotation:[1.18,-.58,.92],opacity:.36,z:.035,radius:1.35,speed:.28,phase:2.7},
 {rotation:[-.42,.92,.28],opacity:.37,z:-.085,radius:1.35,speed:-.20,phase:.6}
];

// Fixed orbital paths built as three independently woven hair-thin filaments.
ringSpecs.forEach(s=>{
 const rotation=new THREE.Quaternion().setFromEuler(new THREE.Euler(...s.rotation));
 const baseColor=new THREE.Color(RING_COLOR);
 const strandCount=3,segments=768,sides=6;
 const strandPhases=[0,Math.PI*2/3,Math.PI*4/3];
 const strandBrightness=[1.0,.72,.52];
 for(let strand=0;strand<strandCount;strand++){
  const positions=[],colors=[],indices=[];
  for(let i=0;i<=segments;i++){
   const u=i/segments*Math.PI*2;
   // Each filament alternates in front of and behind its neighbors, creating a visible braid.
   const weave=Math.sin(3*u+strandPhases[strand])*.00105;
   const centerRadius=s.radius+weave;
   for(let j=0;j<sides;j++){
    const v=j/sides*Math.PI*2;
    const tube=.00048;
    const local=new THREE.Vector3(
     (centerRadius+Math.cos(v)*tube)*Math.cos(u),
     (centerRadius+Math.cos(v)*tube)*Math.sin(u),
     Math.sin(v)*tube
    ).applyQuaternion(rotation);
    positions.push(local.x,local.y,local.z);
    const depth=THREE.MathUtils.clamp((local.z+1.39)/2.78,0,1);
    const front=THREE.MathUtils.smoothstep(depth,.46,.54);
    const light=.10+.90*front;
    const radial=Math.hypot(local.x,local.y);
    const disk=1-THREE.MathUtils.smoothstep(radial,1.02,1.52);
    const dim=1-.995*disk;
    const brightness=light*3.2*dim*strandBrightness[strand];
    colors.push(baseColor.r*brightness,baseColor.g*brightness,baseColor.b*brightness);
   }
  }
  for(let i=0;i<segments;i++)for(let j=0;j<sides;j++){
   const a=i*sides+j,b=i*sides+(j+1)%sides;
   const d=(i+1)*sides+j,e=(i+1)*sides+(j+1)%sides;
   indices.push(a,b,d,b,e,d);
  }
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  geometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
  geometry.setIndex(indices);
  const material=new THREE.MeshBasicMaterial({
   color:0xffffff,vertexColors:true,transparent:true,
   opacity:Math.min(s.opacity*(strand===0?1.8:1.55),.96),
   blending:THREE.AdditiveBlending,depthWrite:true,side:THREE.DoubleSide
  });
  const filament=new THREE.Mesh(geometry,material);
  filament.position.z=s.z+(strand-1)*.0007;
  scene.add(filament);
 }
 // Layered, restrained energy field: a narrow cyan corona plus a very soft outer field.
 // The white orbit core keeps its original .0018 tube width.
 const makeGlowLayer=(tube,opacity,zOffset)=>{
  const glowGeometry=new THREE.TorusGeometry(s.radius,tube,6,512);
  glowGeometry.setAttribute('color',geometry.attributes.color.clone());
  glowGeometry.applyQuaternion(rotation);
  const glowMaterial=new THREE.MeshBasicMaterial({
   color:0x42cfff,vertexColors:true,transparent:true,opacity:Math.min(s.opacity*opacity,.22),
   blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide
  });
  const glow=new THREE.Mesh(glowGeometry,glowMaterial);
  glow.position.z=s.z+zOffset;
  scene.add(glow);
 };
 makeGlowLayer(.0018,.18,-.0018);
 makeGlowLayer(.0032,.055,-.0030);
