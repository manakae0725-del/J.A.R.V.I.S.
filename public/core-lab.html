<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>J.A.R.V.I.S. Core</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
main{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}
#rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#error{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:#9bdfff;font:13px Arial,sans-serif}
</style>
</head>
<body>
<main>
<img id="art" src="/jarvis-core.jpg%20.PNG" alt="J.A.R.V.I.S. Core">
<canvas id="rings"></canvas>
</main>
<div id="error">Core画像またはリング表示を読み込めません。</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const image=document.querySelector('#art');
const canvas=document.querySelector('#rings');
const error=document.querySelector('#error');
let renderer,camera;
const scene=new THREE.Scene();

try{
 renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
 renderer.setSize(innerWidth,innerHeight);
 renderer.setClearColor(0x000000,0);
}catch(e){error.style.display='grid';throw e}

camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,100);
camera.position.z=12;

// Brighter electric cyan-blue sampled to harmonize with the Core's luminous rim.
const RING_COLOR=0x42cfff;
const ringGeometry=new THREE.TorusGeometry(1.39,.0018,6,512);
function createRing(rotation,opacity,z,radius=1.39){
 const material=new THREE.MeshBasicMaterial({
  color:RING_COLOR,transparent:true,opacity,
  blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide
 });
 const mesh=new THREE.Mesh(
  radius===1.39?ringGeometry.clone():new THREE.TorusGeometry(radius,.0018,6,512),
  material
 );
 mesh.rotation.set(...rotation);
 mesh.position.z=z;
 scene.add(mesh);
 return mesh;
}

const ringSpecs=[
 {rotation:[1.02,0,-.55],opacity:.68,z:0,radius:1.39,speed:.34,phase:0},
 {rotation:[1.02,0,.55],opacity:.58,z:-.025,radius:1.39,speed:-.29,phase:2.2},
 {rotation:[.48,.82,-.42],opacity:.54,z:.018,radius:1.39,speed:.25,phase:4.1},
 {rotation:[.48,-.82,.42],opacity:.50,z:-.045,radius:1.39,speed:-.31,phase:1.1},
 {rotation:[1.34,.28,.18],opacity:.40,z:.055,radius:1.43,speed:.22,phase:3.2},
 {rotation:[.28,1.28,-.72],opacity:.38,z:-.065,radius:1.43,speed:-.26,phase:5.0},
 {rotation:[1.18,-.58,.92],opacity:.36,z:.035,radius:1.35,speed:.28,phase:2.7},
 {rotation:[-.42,.92,.28],opacity:.37,z:-.085,radius:1.35,speed:-.20,phase:.6}
];
ringSpecs.forEach(s=>createRing(s.rotation,s.opacity,s.z,s.radius));

// Bright, narrow moving highlights travel along each stationary orbital path.
const sweeps=[];
ringSpecs.forEach(s=>{
 const group=new THREE.Group();
 group.rotation.set(...s.rotation);
 group.position.z=s.z+.008;
 const glow=new THREE.MeshBasicMaterial({
  color:0x9beaff,transparent:true,opacity:.92,
  blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide
 });
 const arc=new THREE.Mesh(
  new THREE.TorusGeometry(s.radius,.0038,6,96,.42),
  glow
 );
 group.add(arc);
 scene.add(group);
 sweeps.push({arc,speed:s.speed,phase:s.phase});
});

function resize(){
 const w=innerWidth,h=innerHeight;
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
 renderer.setSize(w,h);
 const aspect=image.naturalWidth/image.naturalHeight;
 const displayW=Math.min(w,h*aspect);
 const displayH=displayW/aspect;
 const scale=displayH/4.65;
 const viewW=w/scale,viewH=h/scale;
 camera.left=-viewW/2;
 camera.right=viewW/2;
 camera.top=viewH/2;
 camera.bottom=-viewH/2;
 camera.position.set(0,0,12);
 camera.updateProjectionMatrix();
}
image.addEventListener('load',resize);
image.addEventListener('error',()=>{error.style.display='grid';});
addEventListener('resize',resize);
if(image.complete&&image.naturalWidth)resize();

let last=0,elapsed=0;
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;elapsed+=dt;
 sweeps.forEach(s=>{s.arc.rotation.z=s.phase+elapsed*s.speed;});
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
