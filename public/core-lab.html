<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>J.A.R.V.I.S. Core</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
main{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;transform:scale(1.05)}
#rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#error{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:#9bdfff;font:13px Arial,sans-serif}
</style>
</head>
<body>
<main>
<img id="art" src="/jarvis-core.jpg%20.PNG" alt="J.A.R.V.I.S. Core">
<canvas id="rings"></canvas>
</main>
<div id="error">Core画像またはリング表示を読み込めません。</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const image=document.querySelector('#art');
const canvas=document.querySelector('#rings');
const error=document.querySelector('#error');
let renderer,camera;
const scene=new THREE.Scene();

try{
 renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
 renderer.setSize(innerWidth,innerHeight);
 renderer.setClearColor(0x000000,0);
}catch(e){error.style.display='grid';throw e}

camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,100);
camera.position.z=12;

const RING_COLOR=0x42cfff;
const ringSpecs=[
 {rotation:[1.02,0,-.55],opacity:.68,z:0,radius:1.39,speed:.34,phase:0},
 {rotation:[1.02,0,.55],opacity:.58,z:-.025,radius:1.39,speed:-.29,phase:2.2},
 {rotation:[.48,.82,-.42],opacity:.54,z:.018,radius:1.39,speed:.25,phase:4.1},
 {rotation:[.48,-.82,.42],opacity:.50,z:-.045,radius:1.39,speed:-.31,phase:1.1},
 {rotation:[1.34,.28,.18],opacity:.40,z:.055,radius:1.43,speed:.22,phase:3.2},
 {rotation:[.28,1.28,-.72],opacity:.38,z:-.065,radius:1.43,speed:-.26,phase:5.0},
 {rotation:[1.18,-.58,.92],opacity:.36,z:.035,radius:1.35,speed:.28,phase:2.7},
 {rotation:[-.42,.92,.28],opacity:.37,z:-.085,radius:1.35,speed:-.20,phase:.6}
];

// Fixed orbital paths with restrained front/back depth contrast.
ringSpecs.forEach(s=>{
 const geometry=new THREE.TorusGeometry(s.radius,.0018,6,512);
 const rotation=new THREE.Quaternion().setFromEuler(new THREE.Euler(...s.rotation));
 const positions=geometry.attributes.position;
 const baseColor=new THREE.Color(RING_COLOR);
 const depths=[];
 let minZ=Infinity,maxZ=-Infinity;
 for(let i=0;i<positions.count;i++){
  const p=new THREE.Vector3().fromBufferAttribute(positions,i).applyQuaternion(rotation);
  depths.push(p.z);minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z);
 }
 const colors=[];
 const span=Math.max(maxZ-minZ,1e-5);
 for(let i=0;i<positions.count;i++){
  const depth=(depths[i]-minZ)/span;
  // Strong front/back split: deep subdued rear arc, bright readable front arc.
  const t=THREE.MathUtils.clamp((depth-0.46)/0.08,0,1);
  const front=t*t*(3-2*t);
  // Stronger depth separation: rear arcs stay subdued while front arcs carry the energy.
  const light=0.10+0.90*front;
  const intensity=3.2;
  const p=new THREE.Vector3().fromBufferAttribute(positions,i).applyQuaternion(rotation);
  const radial=Math.hypot(p.x,p.y);
  // Hide every added orbit segment projected over the Core disk, not only front-facing arcs.
  const disk=1-THREE.MathUtils.smoothstep(radial,1.02,1.52);
  const dim=1-0.995*disk;
  colors.push(baseColor.r*light*intensity*dim,baseColor.g*light*intensity*dim,baseColor.b*light*intensity*dim);
 }
 geometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
 geometry.applyQuaternion(rotation);

 // Narrow bright white core, preserving the original orbit tube thickness.
 const whiteColors=[];
 for(let i=0;i<colors.length;i+=3){
  const level=Math.max(colors[i],colors[i+1],colors[i+2]);
  whiteColors.push(level,level,level);
 }
 const whiteGeometry=geometry.clone();
 whiteGeometry.setAttribute('color',new THREE.Float32BufferAttribute(whiteColors,3));
 const coreMaterial=new THREE.MeshBasicMaterial({
  color:0xffffff,vertexColors:true,transparent:true,opacity:Math.min(s.opacity*1.8,.98),
  blending:THREE.AdditiveBlending,depthWrite:true,side:THREE.DoubleSide
 });
 const ring=new THREE.Mesh(whiteGeometry,coreMaterial);
 ring.position.z=s.z;
 scene.add(ring);

 // Layered, restrained energy field: a narrow cyan corona plus a very soft outer field.
 // The white orbit core keeps its original .0018 tube width.
 const makeGlowLayer=(tube,opacity,zOffset)=>{
  const glowGeometry=new THREE.TorusGeometry(s.radius,tube,6,512);
  glowGeometry.setAttribute('color',geometry.attributes.color.clone());
  glowGeometry.applyQuaternion(rotation);
  const glowMaterial=new THREE.MeshBasicMaterial({
   color:0x42cfff,vertexColors:true,transparent:true,opacity:Math.min(s.opacity*opacity,.22),
   blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide
  });
  const glow=new THREE.Mesh(glowGeometry,glowMaterial);
  glow.position.z=s.z+zOffset;
  scene.add(glow);
 };
 makeGlowLayer(.0024,.34,-.0010);
 makeGlowLayer(.0048,.12,-.0020);
});

// Pure white light points only: cyan and blue glow layers removed.
const movers=[];
ringSpecs.forEach(s=>{
 const orbit=new THREE.Group();
 orbit.rotation.set(...s.rotation);
 orbit.position.z=s.z+.012;
 scene.add(orbit);

 // One continuous ultra-thin white light streak with strong luminance contrast.
 function makeTaperedStreak(radius,angleLength){
  const segments=64,sides=8,strands=4,positions=[],indices=[],intensities=[];
  // Four hair-thin filaments travel together inside the existing narrow light envelope.
  for(let strand=0;strand<strands;strand++){
   const strandOffset=(strand-(strands-1)/2)*.00115;
   const strandBase=positions.length/3;
   for(let i=0;i<=segments;i++){
    const t=i/segments,a=t*angleLength;
    const taper=Math.sin(Math.PI*t);
    const profile=Math.pow(taper,2.8);
    const width=.00085+.00045*Math.pow(taper,1.7);
    const cx=Math.cos(a)*radius,cy=Math.sin(a)*radius;
    for(let j=0;j<sides;j++){
     const q=j/sides*Math.PI*2;
     const radial=Math.cos(q)*width;
     const z=Math.sin(q)*width+strandOffset;
     positions.push(cx+Math.cos(a)*radial,cy+Math.sin(a)*radial,z);
     intensities.push(.002+.998*profile);
    }
   }
   for(let i=0;i<segments;i++)for(let j=0;j<sides;j++){
    const p=strandBase+i*sides+j,q=strandBase+i*sides+(j+1)%sides;
    const r=strandBase+(i+1)*sides+(j+1)%sides,s0=strandBase+(i+1)*sides+j;
    indices.push(p,q,s0,q,r,s0);
   }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  g.setAttribute('intensity',new THREE.Float32BufferAttribute(intensities,1));
  g.setIndex(indices);return g;
 }
 const streak=new THREE.Mesh(
  makeTaperedStreak(s.radius,.34),
  new THREE.ShaderMaterial({
   transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
   vertexShader:`attribute float intensity; varying float vIntensity; void main(){vIntensity=intensity; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
   fragmentShader:`varying float vIntensity; void main(){float hot=pow(vIntensity,1.55); float alpha=0.035+hot*0.965; gl_FragColor=vec4(vec3(1.0),alpha);}`
  })
 );
 orbit.add(streak);
 movers.push({streak,radius:s.radius,speed:s.speed,phase:s.phase});
});

// Add two more moving white streaks, spaced around existing fixed orbits.
[0,1].forEach(index=>{
 const base=movers[index];
 const extra=base.streak.clone();
 base.streak.parent.add(extra);
 movers.push({streak:extra,radius:base.radius,speed:base.speed,phase:base.phase+Math.PI});
});

function resize(){
 const w=innerWidth,h=innerHeight;
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
 renderer.setSize(w,h);
 const aspect=image.naturalWidth/image.naturalHeight;
 const displayW=Math.min(w,h*aspect);
 const displayH=displayW/aspect;
 const scale=displayH/4.65;
 const viewW=w/scale,viewH=h/scale;
 camera.left=-viewW/2;
 camera.right=viewW/2;
 camera.top=viewH/2;
 camera.bottom=-viewH/2;
 camera.position.set(0,0,12);
 camera.zoom=1.05;
 camera.updateProjectionMatrix();
}
image.addEventListener('load',resize);
image.addEventListener('error',()=>{error.style.display='grid';});
addEventListener('resize',resize);
if(image.complete&&image.naturalWidth)resize();

let last=0,elapsed=0;
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;elapsed+=dt;
 movers.forEach(m=>{
  const angle=m.phase+elapsed*m.speed;
  // Move one continuous tapered streak around the fixed orbital path.
  m.streak.rotation.z=angle-.34;
 });
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
