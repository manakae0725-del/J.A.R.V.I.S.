<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>J.A.R.V.I.S. Core</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
main{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}
#rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#error{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:#9bdfff;font:13px Arial,sans-serif}
</style>
</head>
<body>
<main>
<img id="art" src="/jarvis-core.jpg%20.PNG" alt="J.A.R.V.I.S. Core">
<canvas id="rings"></canvas>
</main>
<div id="error">Core画像またはリング表示を読み込めません。</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const image=document.querySelector('#art');
const canvas=document.querySelector('#rings');
const error=document.querySelector('#error');
let renderer,camera;
const scene=new THREE.Scene();

try{
 renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
 renderer.setSize(innerWidth,innerHeight);
 renderer.setClearColor(0x000000,0);
}catch(e){error.style.display='grid';throw e}

camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,100);
camera.position.z=12;

const ringGeometry=new THREE.TorusGeometry(1.39,.0018,6,512);
function createRing(rotation,opacity,z,radius=1.39){
 const material=new THREE.MeshBasicMaterial({
  color:0x27bfff,transparent:true,opacity,
  blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide
 });
 const mesh=new THREE.Mesh(
  radius===1.39?ringGeometry.clone():new THREE.TorusGeometry(radius,.0018,6,512),
  material
 );
 mesh.rotation.set(...rotation);
 mesh.position.z=z;
 scene.add(mesh);
 return mesh;
}

// Existing four rings retained.
const ringA=createRing([1.02,0,-.55],.48,0);
const ringB=createRing([1.02,0,.55],.38,-.025);
const ringC=createRing([.48,.82,-.42],.34,.018);
const ringD=createRing([.48,-.82,.42],.30,-.045);

// Four additional, finer-looking orbital paths distributed around different axes.
// Their lower opacity keeps the Core readable and avoids a dense cage effect.
const ringE=createRing([1.34,.28,.18],.23,.055,1.43);
const ringF=createRing([.28,1.28,-.72],.21,-.065,1.43);
const ringG=createRing([1.18,-.58,.92],.19,.035,1.35);
const ringH=createRing([-.42,.92,.28],.20,-.085,1.35);

function resize(){
 const w=innerWidth,h=innerHeight;
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
 renderer.setSize(w,h);
 const aspect=image.naturalWidth/image.naturalHeight;
 const displayW=Math.min(w,h*aspect);
 const displayH=displayW/aspect;
 const scale=displayH/4.65;
 const viewW=w/scale,viewH=h/scale;
 camera.left=-viewW/2;
 camera.right=viewW/2;
 camera.top=viewH/2;
 camera.bottom=-viewH/2;
 camera.position.set(0,0,12);
 camera.updateProjectionMatrix();
}
image.addEventListener('load',resize);
image.addEventListener('error',()=>{error.style.display='grid';});
addEventListener('resize',resize);
if(image.complete&&image.naturalWidth)resize();

let last=0,elapsed=0;
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;elapsed+=dt;
 ringA.rotation.z=-.55+Math.sin(elapsed*.10)*.012;
 ringB.rotation.z=.55+Math.sin(elapsed*.09)*.012;
 ringC.rotation.y=.82+Math.sin(elapsed*.075)*.008;
 ringD.rotation.y=-.82+Math.sin(elapsed*.07)*.008;
 ringE.rotation.z=.18+Math.sin(elapsed*.061)*.006;
 ringF.rotation.x=.28+Math.sin(elapsed*.057)*.006;
 ringG.rotation.y=-.58+Math.sin(elapsed*.052)*.006;
 ringH.rotation.z=.28+Math.sin(elapsed*.049)*.006;
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
