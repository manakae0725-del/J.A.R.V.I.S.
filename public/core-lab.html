<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>J.A.R.V.I.S. Core</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
main{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}
#rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#error{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:#9bdfff;font:13px Arial,sans-serif}
</style>
</head>
<body>
<main>
<img id="art" src="/jarvis-core.jpg%20.PNG" alt="J.A.R.V.I.S. Core">
<canvas id="rings"></canvas>
</main>
<div id="error">Core画像またはリング表示を読み込めません。</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const image=document.querySelector('#art');
const canvas=document.querySelector('#rings');
const error=document.querySelector('#error');
let renderer,camera;
const scene=new THREE.Scene();

try{
 renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
 renderer.setSize(innerWidth,innerHeight);
 renderer.setClearColor(0x000000,0);
}catch(e){error.style.display='grid';throw e}

camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,100);
camera.position.z=12;

const RING_COLOR=0x42cfff;
const ringSpecs=[
 {rotation:[1.02,0,-.55],opacity:.68,z:0,radius:1.39,speed:.34,phase:0},
 {rotation:[1.02,0,.55],opacity:.58,z:-.025,radius:1.39,speed:-.29,phase:2.2},
 {rotation:[.48,.82,-.42],opacity:.54,z:.018,radius:1.39,speed:.25,phase:4.1},
 {rotation:[.48,-.82,.42],opacity:.50,z:-.045,radius:1.39,speed:-.31,phase:1.1},
 {rotation:[1.34,.28,.18],opacity:.40,z:.055,radius:1.43,speed:.22,phase:3.2},
 {rotation:[.28,1.28,-.72],opacity:.38,z:-.065,radius:1.43,speed:-.26,phase:5.0},
 {rotation:[1.18,-.58,.92],opacity:.36,z:.035,radius:1.35,speed:.28,phase:2.7},
 {rotation:[-.42,.92,.28],opacity:.37,z:-.085,radius:1.35,speed:-.20,phase:.6}
];

// Fixed orbital paths.
ringSpecs.forEach(s=>{
 const material=new THREE.MeshBasicMaterial({
  color:RING_COLOR,transparent:true,opacity:s.opacity,
  blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide
 });
 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(s.radius,.0018,6,512),material
 );
 ring.rotation.set(...s.rotation);
 ring.position.z=s.z;
 scene.add(ring);
});

// A moving highlight and a bright point of light travel on every ring.
// Each light is parented to its own fixed orbital plane, so the paths never shift.
const movers=[];
ringSpecs.forEach((s,i)=>{
 const orbit=new THREE.Group();
 orbit.rotation.set(...s.rotation);
 orbit.position.z=s.z+.012;
 scene.add(orbit);

 const arcMaterial=new THREE.MeshBasicMaterial({
  color:0xb4f1ff,transparent:true,opacity:.98,
  blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide
 });
 const arc=new THREE.Mesh(
  new THREE.TorusGeometry(s.radius,.0038,6,96,.42),
  arcMaterial
 );
 orbit.add(arc);

 const point=new THREE.Group();
 const core=new THREE.Mesh(
  new THREE.SphereGeometry(.012,16,12),
  new THREE.MeshBasicMaterial({color:0xffffff})
 );
 const innerGlow=new THREE.Mesh(
  new THREE.SphereGeometry(.026,16,12),
  new THREE.MeshBasicMaterial({
   color:0x9ceaff,transparent:true,opacity:.78,
   blending:THREE.AdditiveBlending,depthWrite:false
  })
 );
 const outerGlow=new THREE.Mesh(
  new THREE.SphereGeometry(.052,16,12),
  new THREE.MeshBasicMaterial({
   color:0x28bfff,transparent:true,opacity:.30,
   blending:THREE.AdditiveBlending,depthWrite:false
  })
 );
 point.add(outerGlow,innerGlow,core);
 orbit.add(point);
 movers.push({orbit,arc,point,radius:s.radius,speed:s.speed,phase:s.phase});
});

function resize(){
 const w=innerWidth,h=innerHeight;
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
 renderer.setSize(w,h);
 const aspect=image.naturalWidth/image.naturalHeight;
 const displayW=Math.min(w,h*aspect);
 const displayH=displayW/aspect;
 const scale=displayH/4.65;
 const viewW=w/scale,viewH=h/scale;
 camera.left=-viewW/2;
 camera.right=viewW/2;
 camera.top=viewH/2;
 camera.bottom=-viewH/2;
 camera.position.set(0,0,12);
 camera.updateProjectionMatrix();
}
image.addEventListener('load',resize);
image.addEventListener('error',()=>{error.style.display='grid';});
addEventListener('resize',resize);
if(image.complete&&image.naturalWidth)resize();

let last=0,elapsed=0;
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;elapsed+=dt;
 movers.forEach(m=>{
  const angle=m.phase+elapsed*m.speed;
  m.arc.rotation.z=angle;
  m.point.position.set(
   Math.cos(angle)*m.radius,
   Math.sin(angle)*m.radius,
   .012
  );
  const pulse=1+.16*Math.sin(elapsed*2.8+m.phase);
  m.point.scale.setScalar(pulse);
 });
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
